<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Pulse HK - Transit Network</title>

<!-- Leaflet CSS via local file -->
<link rel="stylesheet" href="leaflet.css"/>

<style>
  /* ==========================================
     CSS ZONE 1: VARIABLES & RESET
     ========================================== */
  :root {
    --theme-color: #059669; /* Emerald 600 */
    --theme-hover: #10b981;
    --bg-light: #121212;
    --bg-white: #1c1c1e;
    --text-main: #ffffff;
    --text-sub: #98989d;
    --border-color: #2c2c2e;
    --accent-blue: #0a84ff;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  /* 3-Tier Text Scaling */
  html { font-size: 16px; transition: font-size 0.2s ease-in-out; }
  html.text-sm { font-size: 14px; } 
  html.text-xs { font-size: 12px; } 

  body {
    background-color: var(--bg-light);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    color-scheme: dark;
  }

  /* ==========================================
     CSS ZONE 2: LAYOUT & VIEWS
     ========================================== */
  .header {
    background-color: var(--theme-color); color: white; padding: 0 12px;
    display: flex; justify-content: center; align-items: center; position: relative;
    z-index: 1001; height: 55px; flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.15rem; font-weight: 700; margin: 0; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-left: 50px; padding-right: 50px; width: 100%; box-sizing: border-box;
  }
  .back-btn {
    position: absolute; left: 4px; top: 0; bottom: 0; width: 44px; display: none;
    align-items: center; justify-content: center; background: none; border: none;
    color: white; font-size: 2.2rem; font-weight: bold; cursor: pointer; padding: 0; z-index: 2; line-height: 1;
  }
  .text-size-btn {
    position: absolute; right: 4px; top: 0; bottom: 0; width: 44px; display: flex;
    align-items: center; justify-content: center; background: none; border: none;
    color: white; font-size: 1.05rem; font-weight: 800; cursor: pointer; padding: 0; z-index: 2;
  }

  .app-switcher {
    background: var(--bg-white);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    height: 44px;
    flex-shrink: 0;
    z-index: 1000;
  }
  .app-switcher-item {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text-sub);
    font-size: 0.9rem;
    font-weight: 700;
    border-right: 1px solid var(--border-color);
    transition: background 0.2s, color 0.2s;
    border-bottom: 2px solid transparent;
  }
  .app-switcher-item:last-child {
    border-right: none;
  }
  .app-switcher-item.active {
    color: var(--theme-color);
    border-bottom: 2px solid var(--theme-color);
    background: rgba(5, 150, 105, 0.05);
  }
  .app-switcher-item:active:not(.active) {
    background: var(--bg-light);
  }

  .view-container {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    display: none; flex-direction: column; background: var(--bg-light);
  }
  .view-container.active { display: flex; }

  /* ==========================================
     CSS ZONE 3: COMPONENTS (Tabs, Lists, ETAs)
     ========================================== */
  .bottom-tabs {
    background-color: var(--bg-white); border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; align-items: center;
    height: 65px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 1001;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-sub); flex: 1; height: 100%; cursor: pointer; font-size: 0.75rem; gap: 4px; transition: color 0.2s;
  }
  .tab.active { color: var(--theme-color); font-weight: 700; }
  .tab-icon { font-size: 1.5rem; margin-bottom: 2px; }

  .location-header {
    background: var(--bg-white); padding: 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
  }
  .location-text { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .refresh-timer { font-size: 1.05rem; color: var(--theme-color); font-weight: 800; font-variant-numeric: tabular-nums; }

  .detail-live-bar {
    background: var(--bg-white); padding: 8px 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;
    color: var(--text-sub); font-weight: 700; flex-shrink: 0;
  }
  .live-dot-pulse {
    color: var(--accent-green); display: inline-flex; align-items: center; gap: 6px; font-weight: 800;
  }

  .route-list-item {
    display: flex; padding: 16px; border-bottom: 1px solid var(--border-color);
    align-items: center; gap: 16px; cursor: pointer; background: var(--bg-light); transition: background 0.2s;
  }
  .route-list-item.inactive-route { opacity: 0.85; }
  .route-list-item:active { background: var(--bg-white); }
  
  .route-no-col {
    min-width: 70px; padding: 6px 8px; border-radius: 8px; font-size: 1.1rem; font-weight: 900;
    text-align: center; color: white; letter-spacing: 0.5px; flex-shrink: 0;
  }
  .route-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .route-dest { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
  .route-sub { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .route-eta-col { text-align: right; min-width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
  .eta-time { font-size: 1.8rem; font-weight: 900; color: var(--accent-green); font-variant-numeric: tabular-nums; line-height: 1; }
  
  .eta-expanded-container { display: none; flex-direction: column; gap: 0; background: #181818; border-bottom: 1px solid var(--border-color); }
  .eta-expanded-container.active { display: flex; }
  .eta-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px dashed var(--border-color); }
  .eta-row:last-child { border-bottom: none; }
  .eta-row-left { display: flex; flex-direction: column; gap: 6px; font-size: 1rem; color: var(--text-main); font-weight: 700; }
  .eta-row-sub { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .eta-row-time { font-size: 1.8rem; font-weight: 900; font-variant-numeric: tabular-nums; }

  /* ==========================================
     CSS ZONE 4: SEARCH, MAPS & UTILS
     ========================================== */
  .search-box-container { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; z-index: 10;}
  .search-input {
    width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px;
    font-size: 1.2rem; outline: none; text-align: center; background: var(--bg-light); color: var(--text-main); font-weight: 700;
  }
  .search-input:focus { border-color: var(--theme-color); }
  .region-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px; }
  .region-filters::-webkit-scrollbar { display: none; }
  .region-btn { flex: 0 0 auto; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-light); color: var(--text-sub); font-size: 0.9rem; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  .region-btn.active { background: var(--theme-color); color: white; border-color: var(--theme-color); }

  #map-container { height: 35vh; width: 100%; background: #111; flex-shrink: 0; border-bottom: 1px solid var(--border-color); transition: height 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); }
  #stop-list-container { flex: 1; overflow-y: auto; position: relative; background: var(--bg-light); }
  
  .stop-item { position: relative; padding: 20px 16px 20px 50px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
  .stop-line { position: absolute; left: 28px; top: 0; bottom: 0; width: 4px; z-index: 1; }
  .stop-item:first-child .stop-line { top: 32px; }
  .stop-item:last-child .stop-line { bottom: auto; height: 32px; }
  .stop-dot { position: absolute; left: 20px; top: 22px; width: 20px; height: 20px; border-radius: 50%; background: #aaa; border: 4px solid var(--bg-light); z-index: 2; }
  .stop-item.active-stop .stop-dot { box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.3); }
  .stop-name { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
  .nearest-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; background: rgba(10,132,255,0.2); color: var(--accent-blue); border: 1px solid rgba(10,132,255,0.4); vertical-align: middle; text-transform: uppercase; }
  
  #global-map-container { flex: 1; width: 100%; background: #111; z-index: 1; position: relative; }
  
  .map-floating-filters {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
    display: flex; gap: 6px; background: rgba(28, 28, 30, 0.88); backdrop-filter: blur(12px);
    padding: 4px; border-radius: 24px; border: 1px solid var(--border-color); box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .map-filter-btn {
    padding: 7px 14px; border-radius: 18px; border: none; background: transparent;
    color: var(--text-sub); font-size: 0.8rem; font-weight: 800; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .map-filter-btn.active { background: var(--theme-color); color: white; }

  .map-bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-white); border-top-left-radius: 20px; border-top-right-radius: 20px; max-height: 70vh; overflow-y: auto; z-index: 1000; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); box-shadow: 0 -4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
  .map-bottom-sheet.active { transform: translateY(0); }
  .sheet-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-white); z-index: 2; }
  .sheet-title { font-size: 1.25rem; font-weight: 800; }
  .sheet-close { font-size: 1.5rem; font-weight: bold; color: var(--text-sub); cursor: pointer; background: none; border: none; }
  
  .text-center { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 1.15rem; }
  .init-loader { padding: 80px 20px; text-align: center; }
  
  .occ-pill { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .occ-seating { background: rgba(48, 209, 88, 0.15); color: var(--accent-green); border: 1px solid rgba(48, 209, 88, 0.3); }
  .occ-standing { background: rgba(255, 159, 10, 0.15); color: var(--accent-orange); border: 1px solid rgba(255, 159, 10, 0.3); }
  .occ-full { background: rgba(227, 24, 55, 0.15); color: #ef4444; border: 1px solid rgba(227, 24, 55, 0.3); }
  .occ-neutral { background: rgba(152, 152, 157, 0.15); color: var(--text-sub); border: 1px solid rgba(152, 152, 157, 0.3); }

  .add-fav-btn { margin: 24px; padding: 20px; background: var(--bg-white); border: 2px dashed var(--border-color); border-radius: 16px; text-align: center; color: var(--accent-blue); font-size: 1.15rem; font-weight: 800; cursor: pointer; transition: background 0.2s; }
  .add-fav-btn:active { background: #2c2c2e; }
  .del-fav-btn { background: rgba(227, 24, 55, 0.15); border: 1px solid rgba(227, 24, 55, 0.3); color: #ef4444; border-radius: 8px; width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }

  .fav-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: flex-end; }
  .fav-modal-content { background: var(--bg-light); width: 100%; height: 90vh; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
  .fav-modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .fav-modal-header h3 { font-size: 1.25rem; font-weight: 800; margin: 0; color: var(--text-main); }
  .fav-modal-close { background: none; border: none; color: var(--text-sub); font-size: 1.8rem; font-weight: bold; cursor: pointer; }
  .fav-modal-search { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .fav-modal-search input { width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1.2rem; background: var(--bg-light); color: var(--text-main); font-weight: 700; text-align: center; }
  .fav-modal-search input:focus { border-color: var(--theme-color); outline: none; }
  .fav-modal-results { flex: 1; overflow-y: auto; background: var(--bg-light); }

  /* Map Tile Inversion */
  .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  .custom-user-icon div { width: 100% !important; height: 100% !important; background: #0a84ff !important; border-radius: 50% !important; border: 3px solid white !important; box-shadow: 0 0 12px rgba(0,0,0,0.8) !important; }
</style>
</head>
<body>

<header class="header">
  <button class="back-btn" id="backBtn" onclick="navigateBack()">‹</button>
  <h1 id="headerTitle">Pulse HK</h1>
  <button class="text-size-btn" onclick="toggleTextSize()">aA</button>
</header>

<!-- Transit Suite App Switcher -->
<div class="app-switcher">
  <a href="https://bus-f4c.pages.dev/" class="app-switcher-item">🚌 Bus</a>
  <div class="app-switcher-item active">🚇 MTR</div>

<main id="view-main" class="view-container active">

        <div class="location-text" id="mainLocationText">Locating nearest station...</div>
    </div>
    <div class="refresh-timer" id="refreshTimerMain">--</div>
  </div>
  <div id="mainRouteList">
      <div class="init-loader">
          <div style="font-size:1.2rem; color:var(--text-main); font-weight: 700;">Connecting to MTR Network...</div>
      </div>
  </div>
</main>

<!-- Route (Search) View -->
<main id="view-search" class="view-container">
  <div class="search-box-container">
   <div class="region-filters">
        <button class="region-btn active" id="filter-ALL" onclick="setRegionFilter('ALL')">All Networks</button>
        <button class="region-btn" id="filter-HR" onclick="setRegionFilter('HR')">Heavy Rail</button>
        <button class="region-btn" id="filter-LRT" onclick="setRegionFilter('LRT')">Light Rail</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search Line (e.g. TCL, 610)" oninput="renderSearchResults()" autocomplete="off">
  </div>
  <div id="searchResults" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Map View -->
<main id="view-map" class="view-container">
    <div id="global-map-container">
        <!-- Floating filter bar over the map -->
        <div class="map-floating-filters">
            <button class="map-filter-btn active" id="mapFilter-ALL" onclick="setMapFilter('ALL')">All</button>
            <button class="map-filter-btn" id="mapFilter-HR" onclick="setMapFilter('HR')">Heavy Rail</button>
            <button class="map-filter-btn" id="mapFilter-LRT" onclick="setMapFilter('LRT')">Light Rail</button>

    <div id="map-bottom-sheet" class="map-bottom-sheet">

</main>

<!-- Favorites View -->
<main id="view-fav" class="view-container">
  <div class="location-header" style="justify-content:center;">
      <div class="location-text">Favorite Lines</div>
  </div>
  <div id="favList" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Route Detail View -->
<main id="view-detail" class="view-container">
  <div id="map-container"></div>
  <div class="detail-live-bar" id="detailLiveBar">
    <span class="live-dot-pulse">● LIVE</span>
    <span id="detailLastUpdated">Loading live times...</span>
  </div>
  <div id="stop-list-container"></div>
</main>

<!-- Bottom Tabs -->
<nav class="bottom-tabs">
  <div class="tab active" onclick="switchTab('main')" id="tab-main"><span class="tab-icon">📍</span><span>Nearby</span></div>
  <div class="tab" onclick="switchTab('search')" id="tab-search"><span class="tab-icon">🚆</span><span>Lines</span></div>
  <div class="tab" onclick="switchTab('map')" id="tab-map"><span class="tab-icon">🗺️</span><span>Map</span></div>
  <div class="tab" onclick="switchTab('fav')" id="tab-fav"><span class="tab-icon">⭐</span><span>Favorites</span></div>
</nav>

<!-- Favorite Add Modal -->
<div id="fav-modal" class="fav-modal-overlay">
    <div class="fav-modal-content">
        <div class="fav-modal-header">
            <h3>Add New Favorite Line</h3>
            <button class="fav-modal-close" onclick="closeFavModal()">✕</button>
        </div>
        <div class="fav-modal-search">
            <input type="text" id="favSearchInput" placeholder="Search line..." oninput="renderFavSearch()" autocomplete="off">
        </div>
        <div id="favSearchResults" class="fav-modal-results"></div>
    </div>
</div>

<!-- Routes definitions -->
<script src="routes.js"></script>

<script>
// ==========================================
// ZONE 1: GLOBAL STATE
// ==========================================

let STATIONS = [];
let currentView = 'main';
let previousView = 'main';
let allStops = [];
let groupedRoutes = []; 
let routeStopsCache = {};
let favRoutes = JSON.parse(localStorage.getItem('mtr_fav_routes_v5') || '[]');
const realRouteCache = JSON.parse(localStorage.getItem('pulse_hk_real_routes') || '{}');

let lastKnownPos = null;
let currentNearestStopKey = null;
let activeRegionFilter = 'ALL';
let activeMapFilter = 'ALL';
let mainExpandedGroupKey = null;
let sheetExpandedGroupKey = null;

// Map & Detail State
let detailRouteGroup = null;
let detailExpandedStopIdx = -1;
let detailOpenToken = 0;
let mapInstance = null; 
let globalMapInstance = null; 
let mapRouteLayer = null;
let mapMarkers = [];
let globalMarkers = [];
let userMarkerDetail = null;
let userMarkerGlobal = null;

// Timers
const REFRESH_INTERVAL = 15;
let countdown = REFRESH_INTERVAL;
let timerInterval = null;
let isSyncing = false;
let gpsWatcherId = null;
const requestCache = new Map();

// Initialize Text Size (0: Normal, 1: Small, 2: Extra Small)
let textSizeState = parseInt(localStorage.getItem('pulse_hk_text_size_state') || '0');
if (textSizeState === 1) document.documentElement.classList.add('text-sm');
if (textSizeState === 2) document.documentElement.classList.add('text-xs');

function toggleTextSize() {
    textSizeState = (textSizeState + 1) % 3;
    localStorage.setItem('pulse_hk_text_size_state', textSizeState.toString());
    document.documentElement.classList.remove('text-sm', 'text-xs');
    if (textSizeState === 1) document.documentElement.classList.add('text-sm');
    if (textSizeState === 2) document.documentElement.classList.add('text-xs');
}


// ==========================================
// ZONE 2: ALGORITHMS & DYNAMIC LOAD LOGIC
// ==========================================

function getGlobalStopKey(s, network) { return `${s.name}_${parseFloat(s.lat).toFixed(2)}_${network}`; }

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  if (lat1 === 0 || lat2 === 0) return Infinity;
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearestStopIdx(stops, pos) {
    let best = -1, bestD = Infinity;
    stops.forEach((s, i) => {
        const d = calculateDistanceKm(pos.lat, pos.lon, parseFloat(s.latitude), parseFloat(s.longitude));
        if (d < bestD) { bestD = d; best = i; }
    });
    return best;
}

function getExpectedHeadway(lineCode, hour) {
    const isPeak = (hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19);
    const peakHeadways = { 'TWL': 2.0, 'ISL': 2.0, 'KTL': 2.1, 'TML': 2.7, 'TKL_POA': 2.5, 'TKL_LHP': 6.0, 'EAL_LW': 3.5, 'EAL_LMC': 8.0, 'TCL': 3.6, 'SIL': 3.3, 'AEL': 10.0, 'DRL': 4.5 };
    const offPeakHeadways = { 'TWL': 3.5, 'ISL': 3.6, 'KTL': 4.0, 'TML': 5.5, 'TKL_POA': 5.0, 'TKL_LHP': 10.0, 'EAL_LW': 6.0, 'EAL_LMC': 12.0, 'TCL': 7.0, 'SIL': 6.0, 'AEL': 15.0, 'DRL': 10.0 };
    return isPeak ? (peakHeadways[lineCode] || 3.0) : (offPeakHeadways[lineCode] || 5.0);
}

const LINE_ZONES = { 'TML': { core: [10, 19] }, 'TWL': { core: [0, 5] }, 'EAL_LW': { core: [0, 4] }, 'EAL_LMC': { core: [0, 4] }, 'TCL': { core: [0, 2] }, 'ISL': { core: [3, 8] }, 'KTL': { core: [0, 4] }, 'TKL_POA': { core: [0, 2] }, 'TKL_LHP': { core: [0, 2] }, 'SIL': { core: [0, 0] }, 'AEL': { core: [0, 1] } };

function getDynamicBaseline(lineCode, currentIdx, destCode, hour) {
    const zone = LINE_ZONES[lineCode];
    if (!zone) return 40; 
    const lineStations = routeStopsCache[lineCode];
    let destIdx = lineStations.findIndex(s => s.code === destCode);
    if (destIdx === -1 || currentIdx === -1) return 40;
    
    const coreStart = zone.core[0], coreEnd = zone.core[1];
    const inCore = currentIdx >= coreStart && currentIdx <= coreEnd;
    const dir = destIdx > currentIdx ? 1 : -1; 
    let towardsCore = (currentIdx < coreStart && dir === 1) || (currentIdx > coreEnd && dir === -1);
    let awayFromCore = (currentIdx < coreStart && dir === -1) || (currentIdx > coreEnd && dir === 1);
    let distFromCore = !inCore ? Math.min(Math.abs(currentIdx - coreStart), Math.abs(currentIdx - coreEnd)) : 0;

    const isAM = hour >= 7 && hour < 10, isPM = hour >= 17 && hour < 20;
    let baseLoad = 40; 
    if (isAM) {
        if (towardsCore) baseLoad = 80 - (distFromCore * 2.5); 
        else if (inCore) baseLoad = 85; 
        else if (awayFromCore) baseLoad = 35; 
    } else if (isPM) {
        if (awayFromCore) baseLoad = 80 - (distFromCore * 4.5); 
        else if (inCore) baseLoad = 75; 
        else if (towardsCore) baseLoad = 35; 
    } else {
        if (inCore) baseLoad = 55; else baseLoad = Math.max(20, 50 - (distFromCore * 2));
    }
    return Math.max(15, Math.min(95, baseLoad)); 
}

function calculateLoadHR(trains, index, isTerminal, lineCode, destCode, currentIdx, currentHour) {
    let baseLoad = getDynamicBaseline(lineCode, currentIdx, destCode, currentHour);
    if (isTerminal) baseLoad = baseLoad * 0.65; 
    const t1 = parseInt(trains[index].ttnt) || 0;
    let t2 = t1 + getExpectedHeadway(lineCode, currentHour); 
    if (index + 1 < trains.length) t2 = parseInt(trains[index + 1].ttnt) || t2;
    else if (index > 0) t2 = t1 + Math.max(2, t1 - (parseInt(trains[index - 1].ttnt) || 0));
    
    const liveHeadway = Math.max(1, t2 - t1), expectedHeadway = getExpectedHeadway(lineCode, currentHour);
    let gapMultiplier = 1.0;
    if (liveHeadway > expectedHeadway) gapMultiplier = Math.pow((liveHeadway / expectedHeadway), 1.2); 
    else if (liveHeadway < expectedHeadway && liveHeadway > 0) gapMultiplier = Math.max(0.4, liveHeadway / expectedHeadway); 
    
    let loadFactor = baseLoad * gapMultiplier + (Math.random() * 6 - 3); 
    return Math.min(99, Math.max(5, Math.round(loadFactor)));
}

function getBaselineLoadLRT(hour) {
    const isPeak = (hour >= 7 && hour < 10) || (hour >= 17 && hour < 20);
    const isLunch = hour >= 12 && hour < 14;
    return isPeak ? 75 : (isLunch ? 50 : 30);
}

function calculateLoadLRT(trains, index, train_length, currentRouteNo, currentHour) {
    let baseLoad = getBaselineLoadLRT(currentHour);
    if (parseInt(train_length) === 2) baseLoad = baseLoad * 0.8; 
    const t1_str = trains[index].time_en ? trains[index].time_en.trim().toLowerCase() : '';
    let t1 = (t1_str === '-' || t1_str === 'arriving') ? 0 : (parseInt(t1_str) || 0);
    
    let nextTrain = null;
    for (let i = index + 1; i < trains.length; i++) {
        if (trains[i].route_no === currentRouteNo) { nextTrain = trains[i]; break; }
    }

    let t2 = t1 + 8; 
    if (nextTrain) {
        const next_t = nextTrain.time_en ? nextTrain.time_en.trim().toLowerCase() : '';
        t2 = (next_t === '-' || next_t === 'arriving') ? 0 : (parseInt(next_t) || (t1 + 8));
    }
    
    const liveHeadway = Math.max(1, t2 - t1), expectedHeadway = 8.0;
    let gapMultiplier = 1.0;
    if (liveHeadway > expectedHeadway) gapMultiplier = Math.pow((liveHeadway / expectedHeadway), 1.1); 
    else if (liveHeadway < expectedHeadway && liveHeadway > 0) gapMultiplier = Math.max(0.4, liveHeadway / expectedHeadway);
    
    let loadFactor = baseLoad * gapMultiplier + (Math.random() * 6 - 3); 
    return Math.min(95, Math.max(5, Math.round(loadFactor)));
}

// -----------------------------------------------------
// Req 2: Fetch Physical Route Geometry from OpenStreetMap
// -----------------------------------------------------
async function getRealRouteGeometry(group) {
    if (realRouteCache[group.key]) return realRouteCache[group.key];

    let lineName = group.dest_e; // 'dest_e' holds the physical line name via LINE_META mapping
    if (lineName.includes('East Rail Line')) lineName = 'East Rail Line';
    if (lineName.includes('Tseung Kwan O Line')) lineName = 'Tseung Kwan O Line';

    let query = '';
    if (group.network === 'HR') {
        // Query both name:en and name just in case OSM tags vary.
        query = `[out:json][timeout:15];(relation["route"~"subway|train|railway"]["name:en"~"${lineName}"];relation["route"~"subway|train|railway"]["name"~"${lineName}"]);out geom;`;
    } else {
        query = `[out:json][timeout:15];relation["route"="light_rail"]["ref"="${group.routeNo}"];out geom;`;
    }

    const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
    
    try {
        const res = await fetch(url);
        const data = await res.json();
        let ways = [];
        
        if (data && data.elements) {
            data.elements.forEach(el => {
                if (el.type === 'relation' && el.members) {
                    el.members.forEach(m => {
                        if (m.type === 'way' && m.geometry) {
                            ways.push(m.geometry.map(pt => [pt.lat, pt.lon]));
                        }
                    });
                }
            });
        }
        
        if (ways.length > 0) {
            realRouteCache[group.key] = ways;
            try { localStorage.setItem('pulse_hk_real_routes', JSON.stringify(realRouteCache)); } catch(e) {}
            return ways;
        }
    } catch(e) { 
        console.warn('Failed to fetch actual geographic route path from OSM:', e); 
    }
    return null; 
}

function buildInternalData() {
    STATIONS = [];
    Object.keys(HR_ROUTES).forEach(hrKey => {
        HR_ROUTES[hrKey].forEach(code => {
            const s = RAW_HR_STATIONS.find(stn => stn.code === code);
            if (s) {
                STATIONS.push({ key: `${hrKey}_${code}`, line: hrKey, code: code, name: s.name, lat: s.lat, lng: s.lng, isTerminal: (code === HR_ROUTES[hrKey][0] || code === HR_ROUTES[hrKey][HR_ROUTES[hrKey].length - 1]) });
            }
        });
    });

    Object.keys(LR_ROUTES).forEach(lrKey => {
        LR_ROUTES[lrKey].forEach(code => {
            const s = LR_STOPS_DICT[code];
            if (s) {
                STATIONS.push({ key: `${lrKey}_${code}`, line: lrKey, code: code, name: s.name, lat: s.lat, lng: s.lng, isTerminal: s.isTerminal });
            }
        });
    });

    Object.keys(LINE_META).forEach(key => {
        const meta = LINE_META[key];
        groupedRoutes.push({
            key: key,
            routeNo: key.replace('LR_', '').replace('EAL_', 'EAL ').replace('TKL_', 'TKL '),
            dest_e: meta.name,
            company: meta.network === 'HR' ? 'MTR Heavy Rail' : 'MTR Light Rail',
            network: meta.network,
            colorHex: meta.colorHex
        });
        
        routeStopsCache[key] = STATIONS.filter(s => s.line === key).map((s, idx) => ({
            ...s,
            stopKey: getGlobalStopKey({name: s.name, lat: s.lat}, meta.network),
            stopName_e: s.name,
            latitude: s.lat,
            longitude: s.lng,
            seq: idx + 1
        }));
    });
    
    const uniqueStops = new Map();
    STATIONS.forEach(s => {
        const meta = LINE_META[s.line];
        const network = meta ? meta.network : 'HR';
        const key = getGlobalStopKey({name: s.name, lat: s.lat}, network);
        
        if (!uniqueStops.has(key)) {
            uniqueStops.set(key, { 
                stopKey: key, 
                stopName_e: s.name, 
                latitude: s.lat, 
                longitude: s.lng,
                code: s.code,
                isTerminal: s.isTerminal,
                network: network,
                routes: new Set([s.line]) 
            });
        } else {
            uniqueStops.get(key).routes.add(s.line);
        }
    });
    allStops = Array.from(uniqueStops.values());
}

async function fetchJSONCached(url) {
    if (requestCache.has(url)) return requestCache.get(url);
    const promise = new Promise(async (resolve) => {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
            clearTimeout(timeoutId);
            if (!response.ok) resolve(null);
            else resolve(await response.json());
        } catch(e) { resolve(null); }
    });
    requestCache.set(url, promise);
    setTimeout(() => requestCache.delete(url), 2000); 
    return promise;
}

async function fetchMtrEtaRaw(group, stopKey) {
    const stn = allStops.find(s => s.stopKey === stopKey && s.routes.has(group.key));
    if(!stn) return [];

    let results = [];
    const currentHour = new Date().getHours();
    const currentIdx = routeStopsCache[group.key].findIndex(s => s.code === stn.code);

    try {
        if (group.network === 'HR') {
            const apiLineCode = LINE_META[group.key].apiCode || group.key; 
            const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${apiLineCode}&sta=${stn.code}`;
            const res = await fetchJSONCached(url);
            
            if(res && res.status === 1 && res.data && res.data[`${apiLineCode}-${stn.code}`]) {
                let currTimeMs = res.data[`${apiLineCode}-${stn.code}`].curr_time ? new Date(res.data[`${apiLineCode}-${stn.code}`].curr_time.replace(/-/g, '/')).getTime() : Date.now();
                
                const data = res.data[`${apiLineCode}-${stn.code}`];
                const validDests = routeStopsCache[group.key].map(s => s.code);
                
                const processDir = (trainsArray) => {
                    const safeArray = trainsArray || []; 
                    safeArray.forEach((t, i) => {
                        if (!validDests.includes(t.dest) && t.dest !== 'ADM') return;
                        if (t.dest === 'LMC' && group.key === 'EAL_LW') return;
                        if (t.dest === 'LOW' && group.key === 'EAL_LMC') return;
                        if (t.dest === 'LHP' && group.key === 'TKL_POA') return;
                        if (t.dest === 'POA' && group.key === 'TKL_LHP') return;

                        const destObj = RAW_HR_STATIONS.find(s => s.code === t.dest);
                        const destName = destObj ? destObj.name : t.dest;
                        const ttnt = parseInt(t.ttnt) || 0;
                        const load = calculateLoadHR(safeArray, i, stn.isTerminal, group.key, t.dest, currentIdx, currentHour);
                        
                        let targetAbsoluteMs = Date.now();
                        let isScheduled = false;

                        if (t.ttnt === "0" || t.ttnt === "-") {
                            targetAbsoluteMs = Date.now() + 15000;
                        } else {
                            let addSecs = 0;
                            if (t.time && t.time.includes(':')) {
                                const apiTime = new Date(t.time.replace(/-/g, '/')).getTime();
                                addSecs = Math.floor((Math.max(0, apiTime - currTimeMs) % 60000) / 1000);
                            } else {
                                addSecs = Math.floor(Math.random() * 45); 
                            }
                            targetAbsoluteMs = Date.now() + (ttnt * 60000) + (addSecs * 1000);
                        }

                        results.push({
                            destName: `To ${destName}`,
                            targetAbsoluteMs: targetAbsoluteMs,
                            platText: `Plat ${t.plat}`,
                            loadFactor: load,
                            carInfo: null,
                            isScheduled: isScheduled
                        });
                    });
                };
                processDir(data.UP);
                processDir(data.DOWN);
            }
        } else {
            const url = `https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${parseInt(stn.code, 10)}`;
            const res = await fetchJSONCached(url);
            if(res && res.status === 1 && res.platform_list) {
                res.platform_list.forEach(plat => {
                    const safeArray = plat.route_list || [];
                    safeArray.forEach((t, i) => {
                        const targetRouteNo = group.key.replace('LR_', '');
                        if (t.route_no.trim() !== targetRouteNo) return;

                        const timeStr = t.time_en ? t.time_en.trim().toLowerCase() : '';
                        let targetAbsoluteMs = Date.now();
                        let isScheduled = false;

                        if (timeStr === '-' || timeStr === 'arriving') {
                            targetAbsoluteMs = Date.now() + 15000;
                        } else {
                            const m = timeStr.match(/\d+/);
                            if(m) { 
                                const mins = parseInt(m[0], 10); 
                                const secs = Math.floor(Math.random() * 60); 
                                targetAbsoluteMs = Date.now() + (mins * 60000) + (secs * 1000);
                            }
                        }
                        
                        const load = calculateLoadLRT(safeArray, i, t.train_length, t.route_no, currentHour);
                        const isTwoCar = (t.train_length === "2" || t.train_length === 2);
                        
                        results.push({
                            destName: `To ${t.dest_en}`,
                            targetAbsoluteMs: targetAbsoluteMs,
                            platText: `Plat ${plat.platform_id}`,
                            loadFactor: load,
                            carInfo: isTwoCar ? '2-Car' : '1-Car',
                            isScheduled: isScheduled
                        });
                    });
                });
            }
        }
    } catch(e) { console.error(e); }
    return results.sort((a,b) => a.targetAbsoluteMs - b.targetAbsoluteMs);
}

function makeUserIcon() {
    return L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] });
}

function updateUserMarkers() {
    if (!lastKnownPos) return;
    const icon = makeUserIcon();
    if (mapInstance) {
        if (!userMarkerDetail) userMarkerDetail = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(mapInstance);
        else userMarkerDetail.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
    }
    if (globalMapInstance) {
        if (!userMarkerGlobal) userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(globalMapInstance);
        else userMarkerGlobal.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
    }
}

function startGPSTracking() {
    if (!navigator.geolocation || gpsWatcherId) return;
    gpsWatcherId = navigator.geolocation.watchPosition((pos) => {
        lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        updateUserMarkers();
    }, (err) => { console.warn('GPS Watch Error:', err); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
}

function refreshGPS(timeoutMs = 4000) {
    return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(lastKnownPos); return; }
        
        const fallback = setTimeout(() => resolve(lastKnownPos), timeoutMs + 500);
        
        navigator.geolocation.getCurrentPosition((pos) => {
            clearTimeout(fallback);
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            resolve(lastKnownPos);
        }, () => {
            clearTimeout(fallback);
            resolve(lastKnownPos);
        }, { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 10000 });
    });
}

function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            document.getElementById('mainLocationText').innerText = 'GPS Not Supported';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false); 
            return;
        }
        document.getElementById('mainLocationText').innerText = 'Locating...';
        
        const fallback = setTimeout(() => {
            document.getElementById('mainLocationText').innerText = 'Location Failed';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false);
        }, 5000);

        navigator.geolocation.getCurrentPosition((pos) => {
            clearTimeout(fallback);
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            
            let closest = null, minDistance = Infinity;
            allStops.forEach(s => {
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                currentNearestStopKey = closest.stopKey;
                const distNotice = minDistance > 3.0 ? ` (${minDistance.toFixed(1)}km)` : '';
                document.getElementById('mainLocationText').innerText = `${closest.stopName_e}${distNotice}`;
                renderMainNearby();
                if (currentView === 'map' && globalMapInstance) renderGlobalMapStops();
                if (currentView === 'search') renderSearchResults();
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby stations';
                document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="padding-top:40px;">Try searching via the Lines tab.</div>';
            }
            startGPSTracking();
            resolve(true);
        }, () => {
            clearTimeout(fallback);
            document.getElementById('mainLocationText').innerText = 'Location Unavailable';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false);
        }, { enableHighAccuracy: true, timeout: 4500, maximumAge: 10000 });
    });
}

async function recenterMap(mapType) {
    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);
    if (!pos) return;
    
    if (mapType === 'detail' && mapInstance) {
        mapInstance.flyTo([pos.lat, pos.lon], 16, { animate: true, duration: 1 });
    } else if (mapType === 'global' && globalMapInstance) {
        globalMapInstance.flyTo([pos.lat, pos.lon], 16, { animate: true, duration: 1 });
    }
}

function setMapFilter(filter) {
    activeMapFilter = filter;
    document.querySelectorAll('.map-filter-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`mapFilter-${filter}`);
    if (btn) btn.classList.add('active');
    renderGlobalMapStops();
}

function renderGlobalMapStops() {
    if (!globalMapInstance) return;
    
    globalMarkers.forEach(m => globalMapInstance.removeLayer(m));
    globalMarkers = [];

    const bounds = globalMapInstance.getBounds();
    const currentZoom = globalMapInstance.getZoom();

    let candidateStops = allStops;
    if (activeMapFilter !== 'ALL') {
        candidateStops = candidateStops.filter(s => s.network === activeMapFilter);
    }

    let visibleStops = candidateStops.filter(s => {
        const lat = parseFloat(s.latitude);
        const lon = parseFloat(s.longitude);
        return bounds.contains([lat, lon]);
    });

    if (currentZoom < 13) {
        visibleStops = visibleStops.filter(s => s.isTerminal || s.routes.size > 1 || s.network === 'HR');
    }

    visibleStops.forEach(s => {
        const isLRT = s.network === 'LRT';
        const borderColor = isLRT ? '#eab308' : 'var(--theme-color)';
        const stopIcon = L.divIcon({
            className: 'custom-stop-icon',
            html: `<div style="width:16px;height:16px;background:white;border:4px solid ${borderColor};border-radius:50%; box-shadow: 0 0 6px rgba(0,0,0,0.6);"></div>`,
            iconSize: [16, 16]
        });

        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], { icon: stopIcon }).addTo(globalMapInstance);
        marker.on('click', () => {
            globalMapInstance.setView(marker.getLatLng(), Math.max(currentZoom, 15), { animate: true });
            openMapSheet(s);
        });
        globalMarkers.push(marker);
    });
}

// -----------------------------------------------------
// Req 2 Update: Draw Real Paths Dynamically
// -----------------------------------------------------
async function drawRouteOnMap(group) {
    if(!mapInstance) return;
    
    if(mapRouteLayer) { 
        mapInstance.removeLayer(mapRouteLayer); 
        mapRouteLayer = null; 
    }
    
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    const stops = routeStopsCache[group.key] || [];
    if(stops.length === 0) return;
    
    // 1. Draw station dots instantly
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);
        marker.on('click', () => {
            expandStop(idx);
            document.getElementById(`stop-item-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        mapMarkers.push(marker);
    });
    
    // 2. Draw temporary dotted straight lines (so map isn't blank while fetching real paths)
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    let fallbackLayer = L.polyline(latlngs, {color: group.colorHex, weight: 6, opacity: 0.4, dashArray: '10, 10'}).addTo(mapInstance);
    
    const bounds = fallbackLayer.getBounds();
    if(userMarkerDetail && lastKnownPos) { bounds.extend(userMarkerDetail.getLatLng()); }
    mapInstance.fitBounds(bounds, { padding: [40, 40] });

    // 3. Fetch real physical track paths and replace the dotted line
    const realWays = await getRealRouteGeometry(group);
    
    if (realWays && realWays.length > 0) {
        mapInstance.removeLayer(fallbackLayer);
        mapRouteLayer = L.polyline(realWays, {color: group.colorHex, weight: 6, opacity: 0.9, lineJoin: 'round', lineCap: 'round'}).addTo(mapInstance);
    } else {
        // If API fails or rate-limits, convert dotted fallback to solid fallback seamlessly
        mapInstance.removeLayer(fallbackLayer);
        mapRouteLayer = L.polyline(latlngs, {color: group.colorHex, weight: 6, opacity: 0.9, lineJoin: 'round'}).addTo(mapInstance);
    }
}

function updateDetailTimestamp() {
    const el = document.getElementById('detailLastUpdated');
    if (el) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        el.innerText = `Updated ${timeStr}`;
    }
}

function updateLiveCountdowns() {
    document.querySelectorAll('.live-countdown').forEach(el => {
        const targetMs = parseInt(el.getAttribute('data-target'));
        const diffMs = Math.max(0, targetMs - Date.now());
        const m = Math.floor(diffMs / 60000);
        const s = Math.floor((diffMs % 60000) / 1000);
        
        const mainTimeEl = el.querySelector('.main-time');
        if (!mainTimeEl) return;
        
        if (m === 0 && s <= 30) {
            mainTimeEl.innerHTML = 'Due';
        } else {
            mainTimeEl.innerHTML = `${m}m <span style="font-size:1.1rem; opacity:0.9; margin-left:1px;">${s}s</span>`;
        }
    });

    document.querySelectorAll('.live-summary').forEach(el => {
        const targetMs = parseInt(el.getAttribute('data-target'));
        const diffMs = Math.max(0, targetMs - Date.now());
        const m = Math.floor(diffMs / 60000);
        const s = Math.floor((diffMs % 60000) / 1000);
        
        if (m === 0 && s <= 30) {
            el.innerHTML = 'Due';
        } else {
            el.innerHTML = `${m}<span style="font-size:1.1rem; margin-left:2px;">m</span>`; 
        }
    });
}

function switchTab(tabId) {
    if (tabId === 'main') {
        mainExpandedGroupKey = null; 
        if (!lastKnownPos) document.getElementById('mainLocationText').innerText = 'Locating...';
        locateNearestStopPromise();
    }
    currentView = tabId;
    detailRouteGroup = null; 
    detailOpenToken++; 
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('headerTitle').innerText = 'Pulse HK';
    
    if (tabId === 'search') {
        renderSearchResults();
    }
    if (tabId === 'fav') renderFavList();
    if (tabId === 'map') {
        closeMapSheet();
        if (!globalMapInstance) {
            initGlobalMap();
        } else {
            globalMapInstance.invalidateSize();
            renderGlobalMapStops();
        }
    }
}

async function autoSelectNearestStop(token) {
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    if (stops.length === 0) return;

    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);

    if (token !== detailOpenToken) return;

    let bestIdx = 0; 
    if (pos) {
        let foundIdx = findNearestStopIdx(stops, pos);
        if (foundIdx !== -1) bestIdx = foundIdx;
    }

    const nameEl = document.querySelector(`#stop-item-${bestIdx} .stop-name`);
    if (nameEl && pos) {
         nameEl.insertAdjacentHTML('beforeend', `<span class="nearest-tag">Nearest GPS</span>`);
    }

    await expandStop(bestIdx, true);
}

function openRouteDetail(groupKey) {
    const group = groupedRoutes.find(g => g.key === groupKey);
    if (!group) return;
    
    previousView = currentView;
    detailRouteGroup = group;
    detailExpandedStopIdx = -1;
    currentView = 'detail';
    const token = ++detailOpenToken;
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-detail').classList.add('active');
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('headerTitle').innerText = group.dest_e;
    
    const updateEl = document.getElementById('detailLastUpdated');
    if (updateEl) updateEl.innerText = 'Locating you...';

    setTimeout(async () => {
        if (token !== detailOpenToken) return;
        if(mapInstance) mapInstance.invalidateSize();
        drawRouteOnMap(group);
        renderStopList();
        
        await autoSelectNearestStop(token);
    }, 250); 
}

function generateExpandedETAsHtml(arrs) {
    if (arrs.length === 0) return '<div style="color:var(--text-sub); text-align:center; padding: 20px;">No scheduled departures.</div>';
    
    let html = '';
    for(let i = 0; i < Math.min(4, arrs.length); i++) {
        const arr = arrs[i];
        
        let occClass = 'occ-neutral', occText = 'Est. Space';
        if(arr.loadFactor) {
            if(arr.loadFactor > 85) { occClass = 'occ-full'; occText = 'Crowded'; }
            else if(arr.loadFactor > 15) { occClass = 'occ-standing'; occText = 'Standing'; }
            else { occClass = 'occ-seating'; occText = 'Has Seats'; }
        }
        
        let badgesHtml = `<span class="occ-pill ${occClass}">${occText}</span>`;
        if(arr.carInfo) badgesHtml += `<span class="occ-pill occ-neutral">${arr.carInfo}</span>`;
        
        let color = arr.isScheduled ? 'var(--accent-orange)' : 'var(--accent-green)';
        
        html += `
            <div class="eta-row">
                <div class="eta-row-left">
                    <span>${arr.destName}</span>
                    <div class="eta-row-sub">
                        <span>${arr.platText}</span>
                        ${badgesHtml}
                    </div>
                </div>
                <div class="eta-row-time live-countdown" data-target="${arr.targetAbsoluteMs}" style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;">
                    <div class="main-time" style="color:${color}; font-size:1.8rem; font-weight:900; font-variant-numeric:tabular-nums;">--</div>
                </div>
            </div>
        `;
    }
    return html;
}

        const normalIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
        if (mapMarkers[idx]) mapMarkers[idx].setIcon(normalIcon);
        detailExpandedStopIdx = -1;
        return;
    }
    
    if(detailExpandedStopIdx !== -1) {
        const prevExp = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
        const prevItem = document.getElementById(`stop-item-${detailExpandedStopIdx}`);
        if (prevExp) prevExp.classList.remove('active');
        if (prevItem) prevItem.classList.remove('active-stop');
        if(mapMarkers[detailExpandedStopIdx]) mapMarkers[detailExpandedStopIdx].setIcon(L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] }));
    }
    
    detailExpandedStopIdx = idx;
    const item = document.getElementById(`stop-item-${idx}`);
    const expandContainer = document.getElementById(`detail-eta-expanded-${idx}`);
    if (!item || !expandContainer) return;
    
    item.classList.add('active-stop');
    expandContainer.classList.add('active');
    expandContainer.innerHTML = '<div style="color:var(--text-sub); padding:20px; text-align:center;">Loading times...</div>';
    
    const activeIcon = L.divIcon({ className: 'custom-active-stop-icon', html: `<div style="width:20px;height:20px;background:white;border:6px solid ${detailRouteGroup.colorHex};border-radius:50%;"></div>`, iconSize: [20, 20] });
    if(mapMarkers[idx]) mapMarkers[idx].setIcon(activeIcon);
    
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (mapInstance && mapMarkers[idx]) {
        mapInstance.setView(mapMarkers[idx].getLatLng(), 15, { animate: true });
    }
    
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    const targetStop = stops[idx];
    
    try {
        const arrs = await fetchMtrEtaRaw(detailRouteGroup, targetStop.stopKey);
        if (detailExpandedStopIdx !== idx) return; 
        expandContainer.innerHTML = generateExpandedETAsHtml(arrs);
        updateDetailTimestamp();
        updateLiveCountdowns();
    } catch (e) {
        expandContainer.innerHTML = '<div style="color:#ef4444; text-align:center; padding: 20px;">Network Failed</div>';
    }
}

function startTimer() {
  clearInterval(timerInterval);
  countdown = REFRESH_INTERVAL;
  document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
  
  timerInterval = setInterval(() => {
    
    updateLiveCountdowns();

    if (isSyncing) return;
    countdown--;
    if (countdown <= 0) {
      isSyncing = true;
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimerMain').innerText = '...';
      
      if (currentView === 'main') {
          renderMainNearby(true).then(() => { isSyncing = false; });
      } else if (currentView === 'detail' && detailExpandedStopIdx !== -1) {
          const stops = routeStopsCache[detailRouteGroup.key] || [];
          const targetStop = stops[detailExpandedStopIdx];
          fetchMtrEtaRaw(detailRouteGroup, targetStop.stopKey).then(arrs => {
              const expandContainer = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
              if(expandContainer) {
                  expandContainer.innerHTML = generateExpandedETAsHtml(arrs);
                  updateLiveCountdowns();
              }
              updateDetailTimestamp();
              isSyncing = false;
          }).catch(() => { isSyncing = false; });
      } else if (currentView === 'map' && sheetExpandedGroupKey) {
          const group = groupedRoutes.find(g => g.key === sheetExpandedGroupKey);
          if(group && currentNearestStopKey) {
              fetchMtrEtaRaw(group, currentNearestStopKey).then(arrs => {
                 const expandContainer = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`);
                 if (expandContainer) {
                     expandContainer.innerHTML = generateExpandedETAsHtml(arrs);
                     updateLiveCountdowns();
                 }
                 isSyncing = false;
              }).catch(() => { isSyncing = false; });
          } else { isSyncing = false; }
      } else { isSyncing = false; }
    } else {
      document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
    }
  }, 1000);
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        clearInterval(timerInterval);
        if (gpsWatcherId) { navigator.geolocation.clearWatch(gpsWatcherId); gpsWatcherId = null; }
    } else if (groupedRoutes.length > 0) {
        startTimer();
        startGPSTracking();
    }
});

window.onload = initApp;
</script>
</body>
</html>
