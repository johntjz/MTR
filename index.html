<!DOCTYPE html>
<html lang="en" class="dark overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MTR Time - Real-Time Network Estimator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans TC', 'Noto Sans SC', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .load-bar {
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lang-btn.active {
            background-color: #10b981;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-4 sm:py-6 px-3 sm:px-6 lg:px-8 bg-slate-950 text-slate-100 overflow-x-hidden w-full max-w-[100vw]">

    <div class="w-full max-w-6xl space-y-4 sm:space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-center justify-between gap-4 glass-panel p-4 sm:p-5 rounded-2xl shadow-2xl w-full">
            <div class="flex items-center gap-3.5 text-center sm:text-left">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
                    <i class="ph-bold ph-train text-2xl text-white"></i>
                </div>
                <div>
                    <h1 id="uiAppTitle" class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                        MTR Time
                    </h1>
                    <p id="uiSubtitle" class="text-[11px] sm:text-sm text-slate-400 font-medium">Real-time ETAs & algorithmic load prediction for Heavy & Light Rail</p>
                </div>
            </div>

            <!-- Language Switcher -->
            <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800 shadow-inner shrink-0">
                <button onclick="setLanguage('en')" id="langBtn-en" class="lang-btn text-xs px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">EN</button>
                <button onclick="setLanguage('tc')" id="langBtn-tc" class="lang-btn text-xs px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">繁中</button>
                <button onclick="setLanguage('sc')" id="langBtn-sc" class="lang-btn text-xs px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">简中</button>
            </div>
        </header>

        <!-- Controls Section -->
        <section class="glass-panel rounded-2xl p-4 sm:p-5 shadow-xl space-y-4 sm:space-y-5 w-full">
            
            <!-- Network Toggle -->
            <div class="flex p-1.5 bg-slate-950/50 border border-slate-800 rounded-xl w-full sm:w-max">
                <button id="btnToggleHR" onclick="switchNetwork('HR')" class="flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white shadow-lg shadow-emerald-900/20 transition">Heavy Rail</button>
                <button id="btnToggleLRT" onclick="switchNetwork('LRT')" class="flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition">Light Rail</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4 items-end border-t border-slate-800 pt-4 sm:pt-5">
                
                <div class="w-full">
                    <label id="lblLineSelect" class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Browse by Line</label>
                    <select id="lineSelect" class="w-full bg-slate-900 border border-slate-700/80 text-slate-100 rounded-xl py-2.5 px-3.5 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-base sm:text-sm font-medium">
                        <!-- Populated dynamically by JS -->
                    </select>
                </div>

                <div class="w-full">
                    <label id="lblStationSelect" class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Station (Interchanges Auto-Link)</label>
                    <select id="stationSelect" class="w-full bg-slate-900 border border-slate-700/80 text-slate-100 rounded-xl py-2.5 px-3.5 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-base sm:text-sm font-medium">
                        <!-- Populated dynamically by JS -->
                    </select>
                </div>

                <div class="w-full mt-1 sm:mt-0">
                    <button id="gpsBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-lg shadow-emerald-600/20 active:scale-[0.98] flex items-center justify-center gap-2 text-sm">
                        <i class="ph-bold ph-crosshair text-base"></i>
                        <span id="uiGpsBtnText" class="truncate">Nearest Station</span>
                    </button>
                </div>
            </div>

            <!-- Interchanges Connected Badges -->
            <div id="interchangeBadges" class="hidden flex-wrap items-center gap-2 pt-2 border-t border-slate-800">
                <span id="uiInterchangeLabel" class="text-[11px] sm:text-xs font-semibold text-slate-400 mr-1">Connected Lines:</span>
                <div id="interchangePills" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Status Indicator Bar -->
            <div class="flex flex-wrap sm:flex-nowrap items-center justify-between px-3 sm:px-4 py-2.5 rounded-xl bg-slate-900/70 border border-slate-800 gap-2">
                <div id="statusBox" class="text-xs sm:text-sm flex items-center gap-2.5 min-w-0">
                    <div class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-yellow-500 animate-pulse shrink-0" id="statusDot"></div>
                    <span id="statusText" class="text-slate-300 font-medium truncate">Connecting...</span>
                </div>
                
                <button id="manualSyncBtn" onclick="fetchRealTimeData()" class="text-xs font-mono text-emerald-400 flex items-center justify-center gap-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 px-3 py-1.5 rounded-lg border border-emerald-500/20 transition cursor-pointer shrink-0">
                    <i class="ph-bold ph-arrows-clockwise text-emerald-400" id="syncIcon"></i>
                    <span id="countdownText">15s</span>
                </button>
            </div>
        </section>

        <!-- Dynamic Results Section -->
        <section id="resultsContainer" class="space-y-6 sm:space-y-8 min-h-[300px] w-full">
            <!-- Dynamically populated by JS -->
        </section>
        
        <!-- Footer -->
        <footer class="text-center text-slate-500 text-xs py-6 space-y-3 border-t border-slate-800/60 w-full">
            <button onclick="openFeedbackModal()" id="btnFeedback" class="inline-flex items-center gap-1.5 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition border border-slate-700 hover:border-slate-600">
                <i class="ph-bold ph-chat-circle-text text-emerald-400"></i>
                Send Feedback
            </button>
            <p class="text-slate-600 font-mono text-[11px]">MTR Time &bull; 2026</p>
        </footer>
    </div>

    <!-- Feedback Modal -->
    <div id="feedbackModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 w-full h-full">
        <div class="bg-slate-900 border border-slate-700/80 rounded-2xl w-full max-w-md p-6 shadow-2xl overflow-hidden relative">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="ph-bold ph-envelope-simple text-emerald-400"></i> Send Feedback
                </h2>
                <button onclick="closeFeedbackModal()" class="text-slate-400 hover:text-white transition p-1">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>
            <form id="feedbackForm" onsubmit="submitFeedback(event)">
                <textarea id="fbMessage" rows="5" required class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl p-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-base sm:text-sm mb-4 resize-none" placeholder="Tell us what you think or report an issue..."></textarea>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeFeedbackModal()" id="btnCancel" class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition border border-slate-700">Cancel</button>
                    <button type="submit" id="btnSend" class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg transition shadow-lg shadow-emerald-600/20">Send</button>
                </div>
            </form>
        </div>
    </div>

                    <p class="text-slate-200 font-medium">Opening your email app...</p>
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <p class="text-sm text-slate-400 mb-2">If nothing happened, your device doesn't have a default mail app set. Please email us directly at:</p>
                        <p class="text-emerald-400 font-mono font-bold select-all">${emailAddress}</p>
                    </div>
                    <button type="button" onclick="closeFeedbackModal(); setTimeout(() => location.reload(), 300);" class="mt-4 px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-lg transition border border-slate-700 w-full">Close</button>
                </div>
            `;
        }

        // Convert Traditional Chinese strings to Simplified Chinese
        function tcToSc(text) {
            if (!text) return text;
            const scMap = {
                '門': '门', '鐵': '铁', '廠': '厂', '圍': '围', '朗': '朗', '康': '康', '愛': '爱', '聖': '圣',
                '逸': '逸', '灣': '湾', '碼': '码', '頭': '头', '澤': '泽', '豐': '丰', '醫': '医', '院': '院',
                '麒': '麒', '麟': '麟', '松': '松', '景': '景', '興': '兴', '銀': '银', '安': '安', '橋': '桥',
                '鳳': '凤', '綫': '线', '車': '车', '廂': '厢', '區': '区', '站': '站', '臺': '台', '東': '东',
                '西': '西', '北': '北', '國': '国', '際': '际', '博': '博', '覽': '览', '館': '馆', '奧': '奥',
                '運': '运', '荔': '荔', '欣': '欣', '涌': '涌', '環': '环', '金': '金', '鐘': '钟', '咀': '咀',
                '華': '华', '埔': '埔', '硤': '硖', '鑽': '钻', '石': '石', '嶺': '岭', '堅': '坚', '尼': '尼',
                '盤': '盘', '銅': '铜', '炮': '炮', '鰂': '鰂', '魚': '鱼', '筲': '筲', '箕': '箕', '邨': '邨',
                '柴': '柴', '將': '将', '軍': '军', '寶': '宝', '琳': '琳', '會': '会', '展': '展', '紅': '红',
                '磡': '磡', '場': '场', '學': '学', '墟': '墟', '粉': '粉', '羅': '罗', '落': '落', '馬': '马',
                '洲': '洲', '海': '海', '洋': '洋', '島': '岛', '烏': '乌', '溪': '溪', '沙': '沙', '鞍': '鞍',
                '恆': '恒', '車': '车', '公': '公', '廟': '庙', '顯': '显', '徑': '径', '啟': '启', '德': '德',
                '瓜': '瓜', '柯': '柯', '士': '士', '甸': '甸', '錦': '锦', '屏': '屏', '濕': '湿', '座': '座',
                '翠': '翠', '頌': '颂', '恒': '恒'
            };
            return text.split('').map(c => scMap[c] || c).join('');
        }

        function updateNetworkToggleUI(net) {
            const t = TRANSLATIONS[currentLang];
            const btnHR = document.getElementById('btnToggleHR');
            const btnLRT = document.getElementById('btnToggleLRT');
            const lblLine = document.getElementById('lblLineSelect');
            
            btnHR.textContent = t.heavyRail;
            btnLRT.textContent = t.lightRail;

            if (net === 'HR') {
                btnHR.className = "flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white shadow-lg shadow-emerald-900/20 transition";
                btnLRT.className = "flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition";
                lblLine.textContent = t.browseByLine;
            } else {
                btnLRT.className = "flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white shadow-lg shadow-emerald-900/20 transition";
                btnHR.className = "flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition";
                lblLine.textContent = t.browseByZone;
            }
        }

        function switchNetwork(net) {
            if (currentNetwork === net) return;
            currentNetwork = net;
            updateNetworkToggleUI(net);
            
            populateLineDropdown();
            const defaultLine = net === 'HR' ? 'TML' : 'LRT_TM';
            lineSelect.value = defaultLine;
            populateStationDropdown(defaultLine);
            
            isInitialLoad = true;
            fetchRealTimeData();
        }

        function init() {
            setLanguage('tc'); // Set initial language to TC
            updateNetworkToggleUI(currentNetwork);
            populateLineDropdown();
            lineSelect.value = 'TML'; // Default line
            populateStationDropdown('TML');

            lineSelect.addEventListener('change', (e) => {
                isInitialLoad = true;
                populateStationDropdown(e.target.value);
                fetchRealTimeData();
            });

            stationSelect.addEventListener('change', () => {
                isInitialLoad = true;
                fetchRealTimeData();
            });
            
            gpsBtn.addEventListener('click', locateNearestStation);

            fetchRealTimeData();
        }

        function setLanguage(lang) {
            currentLang = lang;
            ['en', 'tc', 'sc'].forEach(l => {
                const btn = document.getElementById(`langBtn-${l}`);
                if (btn) {
                    if (l === lang) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });

            const t = TRANSLATIONS[lang];
            document.getElementById('uiAppTitle').textContent = t.appTitle;
            document.getElementById('uiSubtitle').textContent = t.subtitle;
            document.getElementById('lblStationSelect').textContent = t.selectStation;
            document.getElementById('uiGpsBtnText').textContent = t.nearestStation;
            document.getElementById('uiInterchangeLabel').textContent = t.connectedLines;
            
            // Feedback Modal texts
            document.getElementById('btnFeedback').innerHTML = `<i class="ph-bold ph-chat-circle-text text-emerald-400"></i> ${t.feedbackBtn}`;
            document.getElementById('modalTitle').innerHTML = `<i class="ph-bold ph-envelope-simple text-emerald-400"></i> ${t.feedbackTitle}`;
            document.getElementById('fbMessage').placeholder = t.feedbackPlaceholder;
            document.getElementById('btnCancel').textContent = t.cancel;
            document.getElementById('btnSend').textContent = t.send;

            // Preserve current selections when language switches
            const currentSelectedLine = lineSelect.value || 'TML';
            const currentStationKey = stationSelect.value || 'YUL_TML';

            updateNetworkToggleUI(currentNetwork);
            populateLineDropdown();
            lineSelect.value = currentSelectedLine;
            populateStationDropdown(currentSelectedLine, currentStationKey);

            isInitialLoad = true;
            fetchRealTimeData();
        }

        function populateLineDropdown() {
            lineSelect.innerHTML = '';
            Object.entries(LINE_META)
                .filter(([code, meta]) => meta.network === currentNetwork)
                .forEach(([code, meta]) => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = meta.name[currentLang] || meta.name.en;
                    lineSelect.appendChild(opt);
                });
        }

        function populateStationDropdown(lineCode, selectStationKey = null) {
            stationSelect.innerHTML = '';
            const filtered = STATIONS.filter(s => s.line === lineCode);
            
            filtered.forEach(station => {
                const opt = document.createElement('option');
                opt.value = station.key; 
                opt.textContent = station.name[currentLang] || station.name.en;
                stationSelect.appendChild(opt);
            });

            if (selectStationKey && filtered.some(s => s.key === selectStationKey)) {
                stationSelect.value = selectStationKey;
            } else if (filtered.length > 0) {
                stationSelect.value = filtered[0].key;
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return R * c; 
        }

        function locateNearestStation() {
            const t = TRANSLATIONS[currentLang];
            updateStatus(t.locatingGps, 'yellow');
            gpsBtn.disabled = true;
            gpsBtn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-base"></i> <span>${t.locatingGps}</span>`;

            if (!navigator.geolocation) {
                updateStatus(t.gpsDenied, 'red');
                resetGpsBtn();
                fetchRealTimeData();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    let nearest = null;
                    let minDistance = Infinity;

                    STATIONS.forEach(station => {
                        const dist = getDistance(pos.coords.latitude, pos.coords.longitude, station.lat, station.lng);
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearest = station;
                        }
                    });

                    if (nearest) {
                        const stnName = nearest.name[currentLang] || nearest.name.en;
                        const msg = t.nearestFound.replace('{name}', stnName).replace('{dist}', minDistance.toFixed(1));
                        updateStatus(msg, 'green');
                        
                        // Automatically switch tabs if the nearest station is on a different network!
                        const targetMeta = LINE_META[nearest.line];
                        if (targetMeta && targetMeta.network !== currentNetwork) {
                            currentNetwork = targetMeta.network;
                            updateNetworkToggleUI(currentNetwork);
                            populateLineDropdown();
                        }
                        
                        lineSelect.value = nearest.line;
                        populateStationDropdown(nearest.line, nearest.key);
                        isInitialLoad = true;
                        fetchRealTimeData();
                    }
                    resetGpsBtn();
                },
                (err) => {
                    updateStatus(t.gpsFailed, 'red');
                    resetGpsBtn();
                    fetchRealTimeData();
                },
                { timeout: 8000 }
            );
        }

        function resetGpsBtn() {
            const t = TRANSLATIONS[currentLang];
            gpsBtn.disabled = false;
            gpsBtn.innerHTML = `<i class="ph-bold ph-crosshair text-base"></i> <span class="truncate">${t.nearestStation}</span>`;
        }

        function updateStatus(msg, color) {
            statusText.textContent = msg;
            const colors = { yellow: 'bg-yellow-500', green: 'bg-emerald-500', red: 'bg-rose-500' };
            statusDot.className = `w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full animate-pulse shrink-0 ${colors[color]}`;
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            timeRemaining = REFRESH_RATE;
            syncIcon.classList.remove('animate-spin');
            countdownText.textContent = `${timeRemaining}s`;

            countdownTimer = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(countdownTimer);
                    fetchRealTimeData();
                } else {
                    countdownText.textContent = `${timeRemaining}s`;
                }
            }, 1000);
        }

        async function fetchRealTimeData() {
            const t = TRANSLATIONS[currentLang];
            const selectedKey = stationSelect.value;
            if(!selectedKey) return;

            const targetStationObj = STATIONS.find(s => s.key === selectedKey);
            if (!targetStationObj) return;

            // INTERCHANGE LOGIC: Find all lines sharing the exact same key or English name
            const activeStations = STATIONS.filter(s => s.key === targetStationObj.key || s.name.en === targetStationObj.name.en);

            // RenderConnected Interchange Badges
            renderInterchangePills(activeStations);

            if (countdownTimer) clearInterval(countdownTimer);
            syncIcon.classList.add('animate-spin');
            countdownText.textContent = t.syncNow;
            updateStatus(t.syncing, 'yellow');
            
            // Only wipe container with spinner on initial/station changes to prevent scroll jumping
            if (isInitialLoad) {
                resultsContainer.innerHTML = `
                    <div class="glass-panel rounded-2xl p-12 text-center text-slate-400 space-y-3">
                        <i class="ph-bold ph-spinner animate-spin text-4xl text-emerald-400"></i>
                        <p class="text-sm font-medium">${t.syncing}</p>
                    </div>
                `;
            }

            try {
                // Fetch concurrently for all connected lines at this interchange station
                const fetchPromises = activeStations.map(async (stn) => {
                    try {
                        let url, res, data;
                        if (stn.line.startsWith('LRT')) {
                            // Rerouted through Cloudflare proxy
                            url = `/api/lrt?stop=${stn.code}`;
                            res = await fetch(url);
                            data = await res.json();
                            return { type: 'LRT', lineCode: stn.line, stn, data, success: data && data.status === 1 };
                        } else {
                            // Rerouted through Cloudflare proxy
                            url = `/api/mtr?line=${stn.line}&station=${stn.code}`;
                            res = await fetch(url);
                            data = await res.json();
                            return { type: 'HR', lineCode: stn.line, stn, data, success: data && (data.status === 1 || (data.data && Object.keys(data.data).length > 0)) };
                        }
                    } catch (err) {
                        return { type: stn.line.startsWith('LRT') ? 'LRT' : 'HR', lineCode: stn.line, stn, success: false, error: err };
                    }
                });

                const results = await Promise.all(fetchPromises);
                let newHtml = '';
                let lastUpdateTime = new Date().toLocaleTimeString();

                results.forEach(result => {
                    const meta = LINE_META[result.lineCode];
                    const lineName = meta.name[currentLang] || meta.name.en;

                    newHtml += `
                        <div class="space-y-4 w-full">
                            <div class="flex items-center gap-3">
                                <span class="w-2.5 h-7 rounded-full ${meta.color}"></span>
                                <h3 class="text-xl font-bold text-white tracking-wide">
                                    ${lineName}
                                </h3>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
                    `;
                    
                    if (!result.success) {
                        newHtml += `<div class="col-span-full glass-card rounded-2xl p-6 text-center text-rose-400 border-t-4 ${meta.border}">${t.apiError}</div>`;
                    } else if (result.type === 'HR') {
                        // Heavy Rail Data parsing
                        const stationData = result.data.data[`${result.lineCode}-${result.stn.code}`];
                        if (stationData) {
                            if(stationData.curr_time) lastUpdateTime = stationData.curr_time.split(' ')[1] || lastUpdateTime;
                            newHtml += generatePlatformHtml(meta, t.dirUp, 'ph-arrow-circle-up', stationData.UP || [], result.stn.isTerminal, 'HR');
                            newHtml += generatePlatformHtml(meta, t.dirDown, 'ph-arrow-circle-down', stationData.DOWN || [], result.stn.isTerminal, 'HR');
                        } else {
                            newHtml += `<div class="col-span-full glass-card rounded-2xl p-6 text-center text-slate-400">${t.noTrains}</div>`;
                        }
                    } else if (result.type === 'LRT') {
                        // Light Rail Data parsing
                        const platforms = result.data.platform_list || [];
                        if (platforms.length === 0) {
                            newHtml += `<div class="col-span-full glass-card rounded-2xl p-6 text-center text-slate-400">${t.noTrains}</div>`;
                        } else {
                            platforms.forEach(plat => {
                                const platTitle = `${t.platform} ${plat.platform_id}`;
                                newHtml += generatePlatformHtml(meta, platTitle, 'ph-train-regional', plat.route_list || [], result.stn.isTerminal, 'LRT');
                            });
                        }
                    }
                    newHtml += `</div></div>`;
                });

                // Apply the new HTML atomically to prevent scroll jump
                const savedScroll = window.scrollY;
                resultsContainer.innerHTML = newHtml;
                window.scrollTo(0, savedScroll);

                isInitialLoad = false; // Next auto-refresh will be completely silent

                const syncMsg = t.liveSyncAt.replace('{time}', lastUpdateTime);
                updateStatus(syncMsg, 'green');

            } catch (error) {
                console.error(error);
                updateStatus(t.apiError, 'red');
            } finally {
                startCountdown();
            }
        }

        function renderInterchangePills(activeStations) {
            if (activeStations.length <= 1) {
                interchangeBadges.classList.add('hidden');
                interchangeBadges.classList.remove('flex');
                return;
            }

            interchangePills.innerHTML = '';
            activeStations.forEach(stn => {
                const meta = LINE_META[stn.line];
                if (meta) {
                    const pill = document.createElement('span');
                    pill.className = `text-[11px] sm:text-xs px-2 sm:px-2.5 py-1 rounded-full font-medium border ${meta.badge}`;
                    pill.textContent = meta.name[currentLang] || meta.name.en;
                    interchangePills.appendChild(pill);
                }
            });

            interchangeBadges.classList.remove('hidden');
            interchangeBadges.classList.add('flex');
        }

        function calculateLoadHR(trains, index, isTerminal) {
            const t1 = parseInt(trains[index].ttnt) || 0;
            let loadFactor = isTerminal 
                ? Math.max(8, 25 - (t1 * 3.5)) 
                : 25 + (Math.max(0, (index + 1 < trains.length ? parseInt(trains[index + 1].ttnt) || (t1 + 3) : t1 + 3) - t1) * 7);
            return Math.min(98, Math.max(12, Math.round(loadFactor)));
        }

        function calculateLoadLRT(train) {
            let mins = 0;
            if (train.time_en && train.time_en.includes('min')) {
                mins = parseInt(train.time_en) || 1;
            }
            let load = 65 - (mins * 6); 
            if (train.train_length === 1) load += 28; // Single car trains get crowded faster
            return Math.min(98, Math.max(15, Math.round(load)));
        }

        function generatePlatformHtml(meta, title, iconClass, trains, isTerminal, type) {
            const t = TRANSLATIONS[currentLang];
            let html = `
                <div class="glass-card rounded-2xl p-4 sm:p-5 flex flex-col h-full border-t-4 ${meta.border} shadow-lg w-full">
                    <h4 class="text-sm sm:text-base font-bold mb-4 flex items-center gap-2 text-slate-200">
                        <i class="ph-bold ${iconClass} ${meta.text} text-xl shrink-0"></i> 
                        <span class="truncate">${title}</span>
                    </h4>
                    <div class="flex-1 space-y-3">
            `;

            if (trains.length === 0) {
                html += `<div class="bg-slate-900/60 rounded-xl p-6 text-center border border-slate-800 text-slate-400 text-xs font-medium">${t.noTrains}</div>`;
            } else {
                trains.forEach((train, index) => {
                    let destName, minText, platText, loadFactor;

                    if (type === 'HR') {
                        // Heavy Rail
                        const destObj = HEAVY_DESTINATIONS[train.dest];
                        if (destObj) {
                            destName = destObj[currentLang] || destObj.en;
                        } else {
                            destName = train.dest;
                        }

                        if (train.ttnt === "0") {
                            minText = t.arriving;
                        } else {
                            minText = `${train.ttnt} ${t.min}`;
                        }

                        platText = `${t.platform} ${train.plat}`;
                        loadFactor = calculateLoadHR(trains, index, isTerminal);
                    } else {
                        // Light Rail
                        let rawDestName = train.dest_en;
                        if (currentLang === 'tc') rawDestName = train.dest_ch || train.dest_en;
                        else if (currentLang === 'sc') rawDestName = tcToSc(train.dest_ch || train.dest_en);

                        destName = `${train.route_no} ${rawDestName}`;

                        if (train.time_en === "-") {
                            minText = t.departing;
                        } else if (train.time_en === "arriving") {
                            minText = t.arriving;
                        } else {
                            minText = train.time_en ? train.time_en.replace('min', t.min) : '-';
                        }

                        const carUnit = train.train_length > 1 ? t.cars : t.car;
                        platText = `${train.train_length} ${carUnit}`;
                        loadFactor = calculateLoadLRT(train);
                    }
                    
                    let barColor = 'bg-emerald-500';
                    let loadIcon = 'ph-users text-emerald-400';
                    let loadText = t.loadComfortable;

                    if (loadFactor >= 80) { 
                        barColor = 'bg-rose-500'; 
                        loadIcon = 'ph-warning text-rose-400'; 
                        loadText = t.loadCrowded; 
                    } else if (loadFactor >= 55) { 
                        barColor = 'bg-amber-500'; 
                        loadIcon = 'ph-users text-amber-400'; 
                        loadText = t.loadStanding; 
                    }

                    html += `
                        <div class="bg-slate-900/80 rounded-xl p-3 sm:p-4 border border-slate-800 shadow-sm hover:border-slate-700 transition">
                            <div class="flex justify-between items-start mb-2.5 gap-2">
                                <div class="flex-1 min-w-0 pr-2">
                                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">${t.to}</p>
                                    <p class="text-base sm:text-lg font-extrabold text-white leading-tight truncate">${destName}</p>
                                </div>
                                <div class="text-right shrink-0">
                                    <p class="text-xl sm:text-2xl font-black text-white tracking-tight">${minText}</p>
                                    <p class="text-[10px] sm:text-[11px] font-semibold text-slate-400">${platText}</p>
                                </div>
                            </div>
                            
                            <div class="mt-3 space-y-1.5">
                                <div class="flex justify-between items-center text-[11px] sm:text-xs">
                                    <span class="flex items-center gap-1.5 text-slate-300 font-medium">
                                        <i class="ph-bold ${loadIcon}"></i> ${loadText}
                                    </span>
                                    <span class="font-mono font-bold text-slate-300">${loadFactor}%</span>
                                </div>
                                <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                                    <div class="${barColor} h-2 rounded-full load-bar" style="width: ${loadFactor}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div></div>`;
            return html;
        }

        // Initialize application on DOM load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
