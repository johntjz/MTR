<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR Real-Time Load Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc;
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        /* Smooth transition for load factor bars */
        .load-bar {
            transition: width 1s ease-in-out, background-color 0.5s ease;
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 sm:px-6 lg:px-8">

    <div class="w-full max-w-4xl space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 flex items-center justify-center gap-3">
                <i class="ph-fill ph-train text-emerald-400"></i>
                MTR Load Estimator
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Real-time ETAs & algorithmic passenger load prediction</p>
        </header>

        <!-- Controls Section -->
        <section class="glass rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row gap-4 items-end">
                
                <div class="w-full sm:w-1/3">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Line</label>
                    <select id="lineSelect" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg py-2.5 px-3 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        <option value="TCL">Tung Chung Line</option>
                        <option value="TWL">Tsuen Wan Line</option>
                        <option value="TML">Tuen Ma Line</option>
                    </select>
                </div>

                <div class="w-full sm:w-1/3">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Station</label>
                    <select id="stationSelect" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg py-2.5 px-3 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="w-full sm:w-1/3">
                    <button id="gpsBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                        <i class="ph ph-crosshair text-lg"></i>
                        Find Nearest GPS
                    </button>
                </div>
            </div>

            <!-- Status Indicator -->
            <div id="statusBox" class="text-sm px-3 py-2 rounded-lg bg-slate-800/50 border border-slate-700/50 flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse" id="statusDot"></div>
                <span id="statusText" class="text-slate-300">Initializing database...</span>
            </div>
        </section>

        <!-- Results Section -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- UP Direction -->
            <div class="glass rounded-2xl p-5 flex flex-col h-full border-t-4 border-t-blue-500">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <i class="ph ph-arrow-circle-up text-blue-400 text-2xl"></i>
                    Direction 1 (UP)
                </h2>
                <div id="upContainer" class="flex-1 space-y-4">
                    <!-- Cards will be injected here -->
                    <p class="text-slate-400 text-sm text-center py-8 italic">Loading trains...</p>
                </div>
            </div>

            <!-- DOWN Direction -->
            <div class="glass rounded-2xl p-5 flex flex-col h-full border-t-4 border-t-purple-500">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <i class="ph ph-arrow-circle-down text-purple-400 text-2xl"></i>
                    Direction 2 (DOWN)
                </h2>
                <div id="downContainer" class="flex-1 space-y-4">
                    <!-- Cards will be injected here -->
                    <p class="text-slate-400 text-sm text-center py-8 italic">Loading trains...</p>
                </div>
            </div>

        </section>
        
        <footer class="text-center text-slate-500 text-xs py-4">
            <p>Data provided by data.gov.hk. Load factor is an algorithmically simulated estimate.</p>
        </footer>
    </div>

    <script>
        // MTR Station Database with approx coordinates and terminal flags
        const STATIONS = [
            // Tung Chung Line (TCL)
            { line: 'TCL', code: 'HOK', name: 'Hong Kong', lat: 22.2846, lng: 114.1581, isTerminal: true },
            { line: 'TCL', code: 'KOW', name: 'Kowloon', lat: 22.3043, lng: 114.1615, isTerminal: false },
            { line: 'TCL', code: 'OLY', name: 'Olympic', lat: 22.3177, lng: 114.1602, isTerminal: false },
            { line: 'TCL', code: 'NAC', name: 'Nam Cheong', lat: 22.3253, lng: 114.1539, isTerminal: false },
            { line: 'TCL', code: 'LAK', name: 'Lai King', lat: 22.3483, lng: 114.1271, isTerminal: false },
            { line: 'TCL', code: 'TSY', name: 'Tsing Yi', lat: 22.3584, lng: 114.1069, isTerminal: false },
            { line: 'TCL', code: 'SUN', name: 'Sunny Bay', lat: 22.3314, lng: 114.0298, isTerminal: false },
            { line: 'TCL', code: 'TUC', name: 'Tung Chung', lat: 22.2894, lng: 113.9405, isTerminal: true },

            // Tsuen Wan Line (TWL)
            { line: 'TWL', code: 'CEN', name: 'Central', lat: 22.2819, lng: 114.1577, isTerminal: true },
            { line: 'TWL', code: 'ADM', name: 'Admiralty', lat: 22.2795, lng: 114.1646, isTerminal: false },
            { line: 'TWL', code: 'TST', name: 'Tsim Sha Tsui', lat: 22.2976, lng: 114.1722, isTerminal: false },
            { line: 'TWL', code: 'JOR', name: 'Jordan', lat: 22.3049, lng: 114.1717, isTerminal: false },
            { line: 'TWL', code: 'YMT', name: 'Yau Ma Tei', lat: 22.3134, lng: 114.1706, isTerminal: false },
            { line: 'TWL', code: 'MOK', name: 'Mong Kok', lat: 22.3201, lng: 114.1697, isTerminal: false },
            { line: 'TWL', code: 'PRE', name: 'Prince Edward', lat: 22.3245, lng: 114.1681, isTerminal: false },
            { line: 'TWL', code: 'SSP', name: 'Sham Shui Po', lat: 22.3308, lng: 114.1623, isTerminal: false },
            { line: 'TWL', code: 'CSW', name: 'Cheung Sha Wan', lat: 22.3371, lng: 114.1558, isTerminal: false },
            { line: 'TWL', code: 'LCK', name: 'Lai Chi Kok', lat: 22.3374, lng: 114.1485, isTerminal: false },
            { line: 'TWL', code: 'MEF', name: 'Mei Foo', lat: 22.3374, lng: 114.1396, isTerminal: false },
            { line: 'TWL', code: 'LAK', name: 'Lai King', lat: 22.3483, lng: 114.1271, isTerminal: false },
            { line: 'TWL', code: 'KWF', name: 'Kwai Fong', lat: 22.3565, lng: 114.1278, isTerminal: false },
            { line: 'TWL', code: 'KWH', name: 'Kwai Hing', lat: 22.3629, lng: 114.1315, isTerminal: false },
            { line: 'TWL', code: 'TWH', name: 'Tai Wo Hau', lat: 22.3706, lng: 114.1230, isTerminal: false },
            { line: 'TWL', code: 'TSW', name: 'Tsuen Wan', lat: 22.3739, lng: 114.1186, isTerminal: true },

            // Tuen Ma Line (TML) - Key stations subset for performance/demo
            { line: 'TML', code: 'WKS', name: 'Wu Kai Sha', lat: 22.4285, lng: 114.2443, isTerminal: true },
            { line: 'TML', code: 'MOS', name: 'Ma On Shan', lat: 22.4253, lng: 114.2319, isTerminal: false },
            { line: 'TML', code: 'TAW', name: 'Tai Wai', lat: 22.3732, lng: 114.1783, isTerminal: false },
            { line: 'TML', code: 'DIH', name: 'Diamond Hill', lat: 22.3402, lng: 114.2017, isTerminal: false },
            { line: 'TML', code: 'TKW', name: 'To Kwa Wan', lat: 22.3168, lng: 114.1887, isTerminal: false },
            { line: 'TML', code: 'HUH', name: 'Hung Hom', lat: 22.3031, lng: 114.1818, isTerminal: false },
            { line: 'TML', code: 'ETS', name: 'East Tsim Sha Tsui', lat: 22.2963, lng: 114.1748, isTerminal: false },
            { line: 'TML', code: 'AUS', name: 'Austin', lat: 22.3045, lng: 114.1661, isTerminal: false },
            { line: 'TML', code: 'NAC', name: 'Nam Cheong', lat: 22.3253, lng: 114.1539, isTerminal: false },
            { line: 'TML', code: 'MEF', name: 'Mei Foo', lat: 22.3374, lng: 114.1396, isTerminal: false },
            { line: 'TML', code: 'TWW', name: 'Tsuen Wan West', lat: 22.3686, lng: 114.1114, isTerminal: false },
            { line: 'TML', code: 'KSR', name: 'Kam Sheung Road', lat: 22.4343, lng: 114.0645, isTerminal: false },
            { line: 'TML', code: 'YUL', name: 'Yuen Long', lat: 22.4462, lng: 114.0347, isTerminal: false },
            { line: 'TML', code: 'TIS', name: 'Tin Shui Wai', lat: 22.4462, lng: 114.0049, isTerminal: false },
            { line: 'TML', code: 'TUM', name: 'Tuen Mun', lat: 22.3948, lng: 113.9739, isTerminal: true }
        ];

        // DOM Elements
        const lineSelect = document.getElementById('lineSelect');
        const stationSelect = document.getElementById('stationSelect');
        const gpsBtn = document.getElementById('gpsBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const upContainer = document.getElementById('upContainer');
        const downContainer = document.getElementById('downContainer');

        let autoRefreshInterval = null;

        // Initialize App
        function init() {
            populateStationDropdown('TCL');
            
            lineSelect.addEventListener('change', (e) => {
                populateStationDropdown(e.target.value);
                fetchRealTimeData();
            });

            stationSelect.addEventListener('change', fetchRealTimeData);
            
            gpsBtn.addEventListener('click', locateNearestStation);

            // Attempt auto GPS on load
            locateNearestStation();
        }

        // Populate stations based on selected line
        function populateStationDropdown(lineCode, selectStationCode = null) {
            stationSelect.innerHTML = '';
            const filtered = STATIONS.filter(s => s.line === lineCode);
            filtered.forEach(station => {
                const opt = document.createElement('option');
                opt.value = station.code;
                opt.textContent = `${station.name} (${station.code})`;
                stationSelect.appendChild(opt);
            });

            if (selectStationCode) {
                stationSelect.value = selectStationCode;
            }
        }

        // Haversine Formula for Distance Calculation
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return R * c; // Distance in km
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180)
        }

        function locateNearestStation() {
            updateStatus('Locating you via GPS...', 'yellow');
            gpsBtn.disabled = true;
            gpsBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Locating...';

            if (!navigator.geolocation) {
                updateStatus('Geolocation is not supported by your browser.', 'red');
                resetGpsBtn();
                fetchRealTimeData();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let nearest = null;
                    let minDistance = Infinity;

                    STATIONS.forEach(station => {
                        const dist = getDistanceFromLatLonInKm(userLat, userLng, station.lat, station.lng);
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearest = station;
                        }
                    });

                    if (nearest) {
                        updateStatus(`Found nearest: ${nearest.name} (${minDistance.toFixed(1)}km away)`, 'green');
                        lineSelect.value = nearest.line;
                        populateStationDropdown(nearest.line, nearest.code);
                        fetchRealTimeData();
                    }
                    resetGpsBtn();
                },
                (error) => {
                    console.warn(error);
                    updateStatus('GPS Access Denied or Failed. Using default.', 'red');
                    resetGpsBtn();
                    fetchRealTimeData();
                },
                { enableHighAccuracy: false, timeout: 5000, maximumAge: 0 }
            );
        }

        function resetGpsBtn() {
            gpsBtn.disabled = false;
            gpsBtn.innerHTML = '<i class="ph ph-crosshair text-lg"></i> Find Nearest GPS';
        }

        function updateStatus(msg, color) {
            statusText.textContent = msg;
            statusDot.className = `w-2 h-2 rounded-full animate-pulse bg-${color}-500`;
        }

        async function fetchRealTimeData() {
            const line = lineSelect.value;
            const sta = stationSelect.value;
            
            if(!line || !sta) return;

            updateStatus(`Fetching live data for ${sta}...`, 'yellow');
            upContainer.innerHTML = '<p class="text-slate-400 text-sm text-center py-8"><i class="ph ph-spinner animate-spin"></i> Loading...</p>';
            downContainer.innerHTML = '<p class="text-slate-400 text-sm text-center py-8"><i class="ph ph-spinner animate-spin"></i> Loading...</p>';

            try {
                // Fetch from MTR Open API
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}`);
                const data = await response.json();

                if (data.status !== 1) {
                    throw new Error("MTR API returned an error status.");
                }

                const key = `${line}-${sta}`;
                const stationData = data.data[key];

                if (!stationData) {
                    throw new Error("No data available for this station currently.");
                }

                const currentStationDb = STATIONS.find(s => s.line === line && s.code === sta);
                const isTerminal = currentStationDb ? currentStationDb.isTerminal : false;

                const upTrains = stationData.UP || [];
                const downTrains = stationData.DOWN || [];

                renderDirection(upTrains, upContainer, isTerminal);
                renderDirection(downTrains, downContainer, isTerminal);

                updateStatus(`Live Data Updated at ${stationData.curr_time.split(' ')[1]}`, 'green');

                // Schedule next refresh in 45 seconds
                if(autoRefreshInterval) clearInterval(autoRefreshInterval);
                autoRefreshInterval = setTimeout(fetchRealTimeData, 45000);

            } catch (error) {
                console.error(error);
                updateStatus(error.message || 'Failed to fetch MTR data.', 'red');
                upContainer.innerHTML = `<p class="text-red-400 text-sm text-center py-8">Data unavailable.</p>`;
                downContainer.innerHTML = `<p class="text-red-400 text-sm text-center py-8">Data unavailable.</p>`;
            }
        }

        function calculateLoad(trains, index, isTerminal) {
            // Extract TTNT (Time To Next Train)
            const t1 = parseInt(trains[index].ttnt) || 0;
            let loadFactor = 0;

            // Mathematical model logic as requested
            if (isTerminal) {
                // Start/Terminal logic: Load Factor = max(10%, 40% - (ttnt1 * 5%))
                loadFactor = Math.max(10, 40 - (t1 * 5));
            } else {
                // Middle station logic
                // Find H_act (Headway) by looking at the gap between this train and the next
                let t2 = 0;
                if (index + 1 < trains.length) {
                    t2 = parseInt(trains[index + 1].ttnt) || (t1 + 3);
                } else {
                    t2 = t1 + 3; // Default 3 mins if no next train ETA available
                }
                
                const hAct = Math.max(0, t2 - t1); // Prevent negative headway anomalies
                
                // Load Factor = Base_Load (35%) + (H_act * Accumulation_Rate (8% per minute))
                loadFactor = 35 + (hAct * 8);
            }

            // Cap between 0 and 100
            return Math.min(100, Math.max(0, Math.round(loadFactor)));
        }

        function renderDirection(trains, container, isTerminal) {
            container.innerHTML = '';

            if (trains.length === 0) {
                container.innerHTML = `<div class="bg-slate-800/50 rounded-xl p-4 text-center border border-slate-700/50">
                    <p class="text-slate-400 text-sm">No trains scheduled/End of service.</p>
                </div>`;
                return;
            }

            trains.forEach((train, index) => {
                const loadFactor = calculateLoad(trains, index, isTerminal);
                
                // Determine styling based on load factor
                let barColor = 'bg-green-500';
                let icon = 'ph-users text-green-400';
                let loadText = 'Comfortable';

                if (loadFactor >= 80) {
                    barColor = 'bg-red-500';
                    icon = 'ph-warning text-red-400';
                    loadText = 'Crowded';
                } else if (loadFactor >= 50) {
                    barColor = 'bg-yellow-500';
                    icon = 'ph-users text-yellow-400';
                    loadText = 'Standing Room';
                }

                // Convert terminal code to readable name if possible
                const destStation = STATIONS.find(s => s.code === train.dest);
                const destName = destStation ? destStation.name : train.dest;
                const minText = train.ttnt === "0" ? "Arriving" : `${train.ttnt} min`;

                const cardHTML = `
                    <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-sm relative overflow-hidden group hover:border-slate-600 transition">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">To</p>
                                <p class="text-lg font-bold text-white">${destName}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-2xl font-black text-white">${minText}</p>
                                <p class="text-xs text-slate-400">Platform ${train.plat}</p>
                            </div>
                        </div>
                        
                        <!-- Load Factor Indicator -->
                        <div class="mt-2 space-y-1">
                            <div class="flex justify-between items-center text-xs">
                                <span class="flex items-center gap-1 text-slate-300">
                                    <i class="ph ${icon}"></i> 
                                    Est. Load: ${loadText}
                                </span>
                                <span class="font-bold text-slate-200">${loadFactor}%</span>
                            </div>
                            <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-700">
                                <div class="${barColor} h-2.5 rounded-full load-bar" style="width: ${loadFactor}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Run on mount
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
