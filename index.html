        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .load-bar {
            transition: width 1s ease-in-out, background-color 0.5s ease;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 sm:px-6 lg:px-8">

    <div class="w-full max-w-6xl space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 flex items-center justify-center gap-3">
                <i class="ph-fill ph-train-regional text-emerald-400"></i>
                MTR Network Estimator
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Real-time ETAs & algorithmic load prediction for Heavy & Light Rail</p>
        </header>

        <!-- Controls Section -->
        <section class="glass rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex flex-col md:flex-row gap-4 items-end">
                
                <div class="w-full md:w-1/3">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Browse by Line</label>
                    <select id="lineSelect" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg py-2.5 px-3 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        <!-- Populated dynamically by JS -->
                    </select>
                </div>

                <div class="w-full md:w-1/3">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Station (Interchanges Auto-Link)</label>
                    <select id="stationSelect" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg py-2.5 px-3 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="w-full md:w-1/3">
                    <button id="gpsBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                        <i class="ph ph-crosshair text-lg"></i>
                        Nearest Station
                    </button>
                </div>
            </div>

            <!-- Status Indicator -->
            <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-800/50 border border-slate-700/50">
                <div id="statusBox" class="text-sm flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse" id="statusDot"></div>
                    <span id="statusText" class="text-slate-300">Initializing client-side connection to data.gov.hk...</span>
                </div>
                
                <div id="countdownBox" class="hidden text-sm font-mono text-emerald-400 flex items-center gap-1.5 bg-emerald-500/10 px-2 py-1 rounded-md border border-emerald-500/20">
                    <i class="ph ph-arrows-clockwise text-emerald-400" id="syncIcon"></i>
                    <span id="countdownText">15s</span>
                </div>
            </div>
        </section>

        <!-- Dynamic Results Section -->
        <section id="resultsContainer" class="space-y-10">
            <!-- Dynamically populated by JS -->
        </section>
        
        <footer class="text-center text-slate-500 text-xs py-4">
            <p>Data fetched directly via client-side API from data.gov.hk. Load factor is an algorithmically simulated estimate.</p>
        </footer>
    </div>

        function init() {
            // Auto-populate Line Select
            Object.entries(LINE_META).forEach(([code, meta]) => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = meta.name;
                lineSelect.appendChild(opt);
            });
            lineSelect.value = 'TML'; // Default to a line with lots of interchanges

            populateStationDropdown('TML');
            
            lineSelect.addEventListener('change', (e) => {
                populateStationDropdown(e.target.value);
                fetchRealTimeData();
            });

            stationSelect.addEventListener('change', fetchRealTimeData);
            gpsBtn.addEventListener('click', locateNearestStation);

            locateNearestStation();
        }

        function populateStationDropdown(lineCode, selectStationName = null) {

            const filtered = STATIONS.filter(s => s.line === lineCode);

                const opt = document.createElement('option');
                opt.value = station.name; // Use NAME as value for interchange matching
                opt.textContent = station.name;
                stationSelect.appendChild(opt);
            });

            if (selectStationName) {
                stationSelect.value = selectStationName;
            }
        }

        // Distance calc
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return R * c; 
        }

        function locateNearestStation() {
            updateStatus('Locating via GPS...', 'yellow');
            gpsBtn.disabled = true;
            gpsBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Locating...';

            if (!navigator.geolocation) {
                updateStatus('Geolocation denied.', 'red');
                resetGpsBtn();
                fetchRealTimeData();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    let nearest = null;
                    let minDistance = Infinity;

                    STATIONS.forEach(station => {
                        const dist = getDistance(pos.coords.latitude, pos.coords.longitude, station.lat, station.lng);
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearest = station;
                        }
                    });

                    if (nearest) {
                        updateStatus(`Nearest: ${nearest.name} (${minDistance.toFixed(1)}km)`, 'green');
                        lineSelect.value = nearest.line;
                        populateStationDropdown(nearest.line, nearest.name);
                        fetchRealTimeData();
                    }
                    resetGpsBtn();
                },
                (err) => {
                    updateStatus('GPS Failed. Using default.', 'red');
                    resetGpsBtn();
                    fetchRealTimeData();
                },
                { timeout: 5000 }
            );
        }

        function resetGpsBtn() {
            gpsBtn.disabled = false;
            gpsBtn.innerHTML = '<i class="ph ph-crosshair text-lg"></i> Nearest Station';
        }

        function updateStatus(msg, color) {
            statusText.textContent = msg;
            const colors = { yellow: 'bg-yellow-500', green: 'bg-green-500', red: 'bg-red-500' };
            statusDot.className = `w-2 h-2 rounded-full animate-pulse ${colors[color]}`;
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            timeRemaining = REFRESH_RATE;
            countdownBox.classList.remove('hidden');
            syncIcon.classList.remove('animate-spin');
            countdownText.textContent = `${timeRemaining}s`;

            countdownTimer = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(countdownTimer);
                    fetchRealTimeData();
                } else {
                    countdownText.textContent = `${timeRemaining}s`;
                }
            }, 1000);
        }

        async function fetchRealTimeData() {
            const selectedName = stationSelect.value;
            if(!selectedName) return;

            // INTERCHANGE LOGIC: Find all lines that share this exact station name
            const activeStations = STATIONS.filter(s => s.name === selectedName);

            if (countdownTimer) clearInterval(countdownTimer);
            syncIcon.classList.add('animate-spin');
            countdownText.textContent = 'Sync...';
            updateStatus(`Fetching live network data...`, 'yellow');
            
            resultsContainer.innerHTML = '<p class="text-slate-400 text-center py-12"><i class="ph ph-spinner animate-spin text-3xl"></i><br>Syncing platform data from data.gov.hk...</p>';

            try {
                // Fetch concurrently for all intersecting lines
                const fetchPromises = activeStations.map(async (stn) => {
                    try {
                        let url, res, data;
                        if (stn.line === 'LRT') {
                            url = `https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${stn.code}`;
                            res = await fetch(url);
                            data = await res.json();
                            return { type: 'LRT', lineCode: stn.line, stn, data, success: data.status === 1 };
                        } else {
                            url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${stn.line}&sta=${stn.code}`;
                            res = await fetch(url);
                            data = await res.json();
                            return { type: 'HR', lineCode: stn.line, stn, data, success: (data.status === 1 || (data.data && Object.keys(data.data).length > 0)) };
                        }
                    } catch (err) {
                        return { type: stn.line === 'LRT' ? 'LRT' : 'HR', lineCode: stn.line, stn, success: false, error: err };
                    }
                });

                const results = await Promise.all(fetchPromises);
                resultsContainer.innerHTML = ''; 
                
                let lastUpdateTime = new Date().toLocaleTimeString();

                results.forEach(result => {
                    const meta = LINE_META[result.lineCode];
                    
                    const sectionWrapper = document.createElement('div');
                    sectionWrapper.className = "space-y-4";
                    sectionWrapper.innerHTML = `
                        <h3 class="text-xl font-bold text-white flex items-center gap-2">
                            <span class="w-3 h-6 rounded-sm ${meta.color}"></span>
                            ${meta.name}
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="grid-${result.lineCode}"></div>
                    `;
                    resultsContainer.appendChild(sectionWrapper);
                    
                    const grid = document.getElementById(`grid-${result.lineCode}`);

                    if (!result.success) {
                        grid.innerHTML = `<div class="col-span-full glass rounded-xl p-6 text-center text-red-400 border-t-4 ${meta.border}">API Error or End of Service</div>`;
                        return;
                    }

                    if (result.type === 'HR') {
                        // Heavy Rail parsing
                        const stationData = result.data.data[`${result.lineCode}-${result.stn.code}`];
                        if (stationData) {
                            if(stationData.curr_time) lastUpdateTime = stationData.curr_time.split(' ')[1];
                            renderPlatform(grid, meta, "Direction 1 (UP)", 'ph-arrow-circle-up', stationData.UP || [], result.stn.isTerminal, 'HR');
                            renderPlatform(grid, meta, "Direction 2 (DOWN)", 'ph-arrow-circle-down', stationData.DOWN || [], result.stn.isTerminal, 'HR');
                        } else {
                            grid.innerHTML = `<div class="col-span-full glass p-6 text-center text-slate-400">No scheduled trains.</div>`;
                        }
                    } else if (result.type === 'LRT') {
                        // Light Rail parsing
                        const platforms = result.data.platform_list || [];
                        if (platforms.length === 0) {
                            grid.innerHTML = `<div class="col-span-full glass p-6 text-center text-slate-400">No scheduled Light Rail trains.</div>`;
                        } else {
                            platforms.forEach(plat => {
                                renderPlatform(grid, meta, `Platform ${plat.platform_id}`, 'ph-train-track', plat.route_list || [], result.stn.isTerminal, 'LRT');
                            });
                        }
                    }
                });

                updateStatus(`Live Data Synchronized at ${lastUpdateTime}`, 'green');

            } catch (error) {
                console.error(error);
                updateStatus('Critical failure loading network data.', 'red');
            } finally {
                startCountdown();
            }
        }

        function calculateLoadHR(trains, index, isTerminal) {
            const t1 = parseInt(trains[index].ttnt) || 0;
            let loadFactor = isTerminal ? Math.max(5, 25 - (t1 * 4)) : 20 + (Math.max(0, (index + 1 < trains.length ? parseInt(trains[index + 1].ttnt) || (t1 + 3) : t1 + 3) - t1) * 6);
            return Math.min(100, Math.max(0, Math.round(loadFactor)));
        }

        function calculateLoadLRT(train) {
            // LRT load estimation based on time strings and train length (1 vs 2 cars)
            let mins = 0;
            if (train.time_en.includes('min')) {
                mins = parseInt(train.time_en) || 1;
            }
            let load = 60 - (mins * 5); // base
            if (train.train_length === 1) load += 25; // 1-car trains get crowded faster
            return Math.min(100, Math.max(10, load));
        }

        function renderPlatform(grid, meta, title, iconClass, trains, isTerminal, type) {
            const container = document.createElement('div');
            container.className = `glass rounded-2xl p-5 flex flex-col h-full border-t-4 ${meta.border}`;
            
            let html = `
                <h4 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="ph ${iconClass} ${meta.text} text-xl"></i> ${title}
                </h4>
                <div class="flex-1 space-y-4">
            `;

            if (trains.length === 0) {
                html += `<div class="bg-slate-800/50 rounded-xl p-4 text-center border border-slate-700/50 text-slate-400 text-sm">No trains scheduled.</div>`;
            } else {
                trains.forEach((train, index) => {
                    let destName, minText, platText, loadFactor;

                    if (type === 'HR') {
                        const destStation = STATIONS.find(s => s.code === train.dest && s.line !== 'LRT');
                        destName = destStation ? destStation.name : train.dest;
                        minText = train.ttnt === "0" ? "Arriving" : `${train.ttnt} min`;
                        platText = `Platform ${train.plat}`;
                        loadFactor = calculateLoadHR(trains, index, isTerminal);
                    } else {
                        // LRT
                        destName = `${train.route_no} ${train.dest_en}`;
                        minText = train.time_en === "-" ? "Departing" : train.time_en;
                        platText = `${train.train_length} Car${train.train_length > 1 ? 's' : ''}`;
                        loadFactor = calculateLoadLRT(train);
                    }
                    
                    let barColor = 'bg-emerald-500';
                    let loadIcon = 'ph-users text-emerald-400';
                    let loadText = 'Comfortable';

                    if (loadFactor >= 85) { barColor = 'bg-red-500'; loadIcon = 'ph-warning text-red-400'; loadText = 'Crowded'; } 
                    else if (loadFactor >= 60) { barColor = 'bg-yellow-500'; loadIcon = 'ph-users text-yellow-400'; loadText = 'Standing Room'; }

                    html += `
                        <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-sm relative overflow-hidden transition hover:border-slate-500">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">To</p>
                                    <p class="text-lg font-bold text-white">${destName}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-black text-white">${minText}</p>
                                    <p class="text-xs text-slate-400">${platText}</p>
                                </div>
                            </div>
                            
                            <div class="mt-2 space-y-1">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="flex items-center gap-1 text-slate-300">
                                        <i class="ph ${loadIcon}"></i> ${loadText}
                                    </span>
                                    <span class="font-bold text-slate-200">${loadFactor}%</span>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-700">
                                    <div class="${barColor} h-2.5 rounded-full load-bar" style="width: ${loadFactor}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
            grid.appendChild(container);
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
