<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransitPulse HK - MTR & Light Rail Real-Time Arrival</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mtr: {
              ktl: '#00AF41', // Kwun Tong Line Green
              twl: '#E60012', // Tsuen Wan Line Red
              isl: '#007DC3', // Island Line Blue
              sil: '#B5BD00', // South Island Line Lime
              tkl: '#A35EB2', // Tseung Kwan O Line Purple
              tcl: '#F38B00', // Tung Chung Line Orange
              ael: '#00888A', // Airport Express Teal
              eal: '#53B7E8', // East Rail Line Light Blue
              tml: '#923011', // Tuen Ma Line Brown
              drl: '#F550A1', // Disneyland Resort Line Pink
              lrt: '#E97200', // Light Rail Orange
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }
    .pulse-glow {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

  <header class="flex-none bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 via-rose-500 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-rose-900/30">
          <i class="fa-solid font-bold text-lg fa-train-subway"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-base font-bold tracking-tight text-white leading-none">TransitPulse <span class="text-rose-500">HK</span></h1>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">MTR / LRT</span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5" id="header-subtitle">Real-Time Train Arrival Tracker</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- 15-Second Refresh Indicator -->
        <div class="hidden sm:flex items-center space-x-2 bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-lg text-xs" title="Auto-resyncs every 15s without scroll jump">
          <div class="relative w-4 h-4 flex items-center justify-center">
            <svg class="w-4 h-4 transform -rotate-90">
              <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" class="text-slate-700" fill="transparent"/>
              <circle id="timer-ring" cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" class="text-rose-500 transition-all duration-1000 ease-linear" fill="transparent" stroke-dasharray="37.7" stroke-dashoffset="0"/>
            </svg>
            <i id="sync-icon" class="fa-solid fa-arrows-rotate text-[8px] text-slate-300 absolute"></i>
          </div>
          <span class="text-slate-300 font-mono text-xs"><span id="timer-count">15</span>s</span>
        </div>

        <!-- Language Dropdown -->
        <div class="relative">
          <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg px-2.5 py-1.5 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500 cursor-pointer transition">
            <option value="en">English</option>
            <option value="zh-HK">繁體中文</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </div>

        <!-- Manual Refresh Button -->
        <button onclick="triggerManualRefresh()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 text-xs flex items-center justify-center transition active:scale-95" title="Refresh Now">
          <i id="refresh-btn-icon" class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col min-h-0 max-w-6xl w-full mx-auto p-3 sm:p-4 gap-4">

    <!-- Scroll Fix Status Bar -->
    <div class="bg-slate-900/60 border border-emerald-500/20 rounded-xl px-3 py-2 text-xs text-slate-300 flex items-center justify-between gap-2 shadow-sm">
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center justify-center w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="smooth-sync-text" class="text-slate-300">Background Sync Active: DOM scroll locked, auto-refreshing every <strong>15 seconds</strong>.</span>
      </div>
      <div class="hidden md:flex items-center space-x-2 text-slate-400 text-[11px]">
        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
        <span id="mtr-optimal-text">15s Interval optimized for MTR schedule stability</span>
      </div>
    </div>

    <!-- Mode Selector -->
    <div class="flex border-b border-slate-800 bg-slate-900/40 p-1 rounded-xl">
      <button id="tab-heavy" onclick="switchNetwork('heavy')" class="flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center justify-center space-x-2 bg-rose-600 text-white shadow-md">
        <i class="fa-solid fa-train"></i>
        <span id="label-heavy-rail">MTR Heavy Rail</span>
      </button>
      <button id="tab-lrt" onclick="switchNetwork('lrt')" class="flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center justify-center space-x-2 text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-train-tram"></i>
        <span id="label-light-rail">Light Rail (輕鐵)</span>
      </button>
    </div>

    <!-- Filter Control Panel -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-3 sm:p-4 shadow-xl">
      
      <!-- HEAVY RAIL FILTERS -->
      <div id="heavy-controls" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-[11px] font-medium uppercase tracking-wider text-slate-400 mb-1" id="lbl-select-line">Select Line</label>
          <select id="heavy-line-select" onchange="onHeavyLineChange()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs sm:text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-rose-500 focus:outline-none">
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-medium uppercase tracking-wider text-slate-400 mb-1" id="lbl-select-station">Select Station</label>
          <select id="heavy-station-select" onchange="onHeavyStationChange()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs sm:text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-rose-500 focus:outline-none">
          </select>
        </div>

        <div class="sm:col-span-2 md:col-span-1">
          <label class="block text-[11px] font-medium uppercase tracking-wider text-slate-400 mb-1" id="lbl-filter-dir">Direction Filter</label>
          <div class="grid grid-cols-3 gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs">
            <button id="dir-all" onclick="setDirectionFilter('ALL')" class="py-1.5 rounded font-medium text-center transition bg-slate-700 text-white">All</button>
            <button id="dir-up" onclick="setDirectionFilter('UP')" class="py-1.5 rounded font-medium text-center transition text-slate-400 hover:text-white">Up</button>
            <button id="dir-down" onclick="setDirectionFilter('DOWN')" class="py-1.5 rounded font-medium text-center transition text-slate-400 hover:text-white">Down</button>
          </div>
        </div>
      </div>

      <!-- LIGHT RAIL FILTERS -->
      <div id="lrt-controls" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-[11px] font-medium uppercase tracking-wider text-slate-400 mb-1" id="lbl-select-region">Region / District</label>
          <select id="lrt-region-select" onchange="onLrtRegionChange()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs sm:text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-medium uppercase tracking-wider text-slate-400 mb-1" id="lbl-select-lrt-stop">Light Rail Stop</label>
          <select id="lrt-stop-select" onchange="onLrtStopChange()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs sm:text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </select>
        </div>

        <div class="sm:col-span-2 md:col-span-1">
          <label class="block text-[11px] font-medium uppercase tracking-wider text-slate-400 mb-1" id="lbl-lrt-route-filter">Search LRT Route</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-500"></i>
            <input type="text" id="lrt-route-search" oninput="onLrtSearchInput()" placeholder="Filter route e.g. 505, 751..." class="w-full bg-slate-800 border border-slate-700 pl-8 pr-3 py-2 text-xs sm:text-sm rounded-lg text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
        </div>
      </div>

    </section>

    <!-- Scrollable Arrival Content Display Area -->
    <div id="arrival-scroll-container" class="flex-1 min-h-0 overflow-y-auto pr-1 space-y-3 rounded-xl">
      <div id="arrival-cards-wrapper" class="space-y-3">
      </div>
    </div>

    <!-- Footer Stats / Last Updated Time -->
    <footer class="flex-none bg-slate-900/50 border border-slate-800 rounded-xl px-4 py-2 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-clock text-slate-500"></i>
        <span><span id="lbl-last-updated">Last Updated:</span> <span id="last-updated-time" class="text-slate-200 font-mono">--:--:--</span></span>
      </div>
      <div class="flex items-center space-x-4 text-[11px]">
        <span class="flex items-center space-x-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="lbl-status-normal">Normal Service</span>
        </span>
        <span class="text-slate-600">|</span>
        <span id="lbl-data-source">Source: GovHK Open Data / MTR API</span>
      </div>
    </footer>

  </main>

    /* =========================================================================
       AUTO-REFRESH TIMER ENGINE (VISIBILITY AWARE)
       ========================================================================= */

    function startAutoRefreshTimer() {
      stopAutoRefreshTimer(); // Prevent duplicate intervals
      timerCountdown = REFRESH_INTERVAL_SECONDS;
      updateTimerRingVisuals();

      timerInterval = setInterval(() => {
        // VISIBILITY GUARD: Completely halts logic in background tabs / locked screens
        if (document.hidden) return; 

        timerCountdown--;
        if (timerCountdown <= 0) {
          timerCountdown = REFRESH_INTERVAL_SECONDS;
          fetchAndRenderData(true);
        }
        updateTimerRingVisuals();
      }, 1000);
    }

    function stopAutoRefreshTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // React to phone locking or app switching
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAutoRefreshTimer();
      } else {
        // Fetch fresh data instantly on return, then restart timer
        fetchAndRenderData(true);
        startAutoRefreshTimer();
      }
    });

    function updateTimerRingVisuals() {
      document.getElementById('timer-count').innerText = timerCountdown;
      const ring = document.getElementById('timer-ring');
      const maxOffset = 37.7;
      const progress = (REFRESH_INTERVAL_SECONDS - timerCountdown) / REFRESH_INTERVAL_SECONDS;
      const strokeOffset = maxOffset - (progress * maxOffset);
      ring.style.strokeDashoffset = strokeOffset;
    }

    function triggerManualRefresh() {
      const icon = document.getElementById('refresh-btn-icon');
      icon.classList.add('fa-spin');
      timerCountdown = REFRESH_INTERVAL_SECONDS;
      updateTimerRingVisuals();

      fetchAndRenderData(true).finally(() => {
        setTimeout(() => icon.classList.remove('fa-spin'), 600);
      });
    }

    /* =========================================================================
       DATA FETCH & SCROLL JUMP PREVENTION ENGINE
       ========================================================================= */

    let cachedScheduleItems = [];

    async function fetchAndRenderData(isBackground = false) {
      const syncIcon = document.getElementById('sync-icon');
      syncIcon.classList.add('fa-spin');

      try {
        if (currentNetwork === 'heavy') {
          const lineCode = document.getElementById('heavy-line-select').value;
          const stationCode = document.getElementById('heavy-station-select').value;
          
          try {
            // Fetch live API data from Edge Cache Node
            const res = await fetch(`/api/mtr?line=${lineCode}&station=${stationCode}`);
            if (!res.ok) throw new Error('Proxy offline');
            cachedScheduleItems = await res.json();
          } catch (e) {
            // Graceful fallback to mock UI testing generator if API isn't deployed yet
            cachedScheduleItems = generateHeavyRailScheduleData();
          }
        } else {
          try {
            const stopId = document.getElementById('lrt-stop-select').value;
            // Fetch live API data from Edge Cache Node
            const res = await fetch(`/api/lrt?stop=${stopId}`);
            if (!res.ok) throw new Error('Proxy offline');
            cachedScheduleItems = await res.json();
          } catch (e) {
             // Graceful fallback to mock UI testing generator if API isn't deployed yet
            cachedScheduleItems = generateLrtScheduleData();
          }
        }
      } catch (err) {
        console.error("Schedule retrieval issue:", err);
      } finally {
        setTimeout(() => syncIcon.classList.remove('fa-spin'), 500);
      }

      const now = new Date();
      document.getElementById('last-updated-time').innerText = now.toTimeString().split(' ')[0];
      renderDataSilently();
    }

    function renderDataSilently() {
      const container = document.getElementById('arrival-scroll-container');
      const cardsWrapper = document.getElementById('arrival-cards-wrapper');

      const savedContainerScrollTop = container.scrollTop;
      const savedWindowScrollY = window.scrollY;

      let filteredItems = [...cachedScheduleItems];
      if (currentNetwork === 'heavy') {
        if (directionFilter === 'UP') {
          filteredItems = filteredItems.filter(item => item.dir === 'UP');
        } else if (directionFilter === 'DOWN') {
          filteredItems = filteredItems.filter(item => item.dir === 'DOWN');
        }
      } else {
        if (selectedLrtRouteSearch) {
          filteredItems = filteredItems.filter(item => item.route.toLowerCase().includes(selectedLrtRouteSearch.toLowerCase()));
        }
      }

      if (filteredItems.length === 0) {
        cardsWrapper.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center text-slate-400">
            <i class="fa-solid fa-circle-info text-2xl mb-2 text-slate-500"></i>
            <p class="text-sm font-medium">${translations[currentLanguage].noData}</p>
          </div>
        `;
      } else {
        const htmlContent = filteredItems.map(item => createArrivalCardHtml(item)).join('');
        cardsWrapper.innerHTML = htmlContent;
      }

      requestAnimationFrame(() => {
        container.scrollTop = savedContainerScrollTop;
        window.scrollTo(0, savedWindowScrollY);
      });
    }

    /* =========================================================================
       MOCK GENERATOR (FALLBACK FOR LOCAL TESTING WITHOUT PROXY)
       ========================================================================= */

    function generateHeavyRailScheduleData() {
      const lineCode = document.getElementById('heavy-line-select').value;
      const line = HEAVY_RAIL_LINES.find(l => l.code === lineCode) || HEAVY_RAIL_LINES[0];
      const stationCode = document.getElementById('heavy-station-select').value;
      const station = line.stations.find(s => s.code === stationCode) || line.stations[0];
      const firstStation = line.stations[0];
      const lastStation = line.stations[line.stations.length - 1];
      const now = new Date();
      const results = [];

      if (station.code !== lastStation.code) {
        const upOffsets = [2, 6, 11, 17];
        upOffsets.forEach((mins, idx) => {
          const arrTime = new Date(now.getTime() + mins * 60000);
          results.push({
            id: `heavy-up-${idx}`,
            dir: 'UP',
            routeCode: line.code,
            badgeLabel: line.code,
            lineColor: line.color,
            platform: '1',
            destination: lastStation.name,
            minutes: mins,
            timeStr: arrTime.toTimeString().substring(0, 5),
            cars: line.code === 'EAL' ? 9 : (line.code === 'SIL' ? 3 : 8)
          });
        });
      }

      if (station.code !== firstStation.code) {
        const downOffsets = [1, 5, 10, 15];
        downOffsets.forEach((mins, idx) => {
          const arrTime = new Date(now.getTime() + mins * 60000);
          results.push({
            id: `heavy-down-${idx}`,
            dir: 'DOWN',
            routeCode: line.code,
            badgeLabel: line.code,
            lineColor: line.color,
            platform: '2',
            destination: firstStation.name,
            minutes: mins,
            timeStr: arrTime.toTimeString().substring(0, 5),
            cars: line.code === 'EAL' ? 9 : (line.code === 'SIL' ? 3 : 8)
          });
        });
      }
      return results;
    }

    function generateLrtScheduleData() {
      const regionId = document.getElementById('lrt-region-select').value;
      const region = LIGHT_RAIL_REGIONS.find(r => r.id === regionId) || LIGHT_RAIL_REGIONS[0];
      const stopId = document.getElementById('lrt-stop-select').value;
      const stop = region.stops.find(s => s.id === stopId) || region.stops[0];
      const now = new Date();
      const results = [];

      stop.routes.forEach((routeNo, rIdx) => {
        const baseMins = [2 + rIdx, 7 + (rIdx * 2)];
        baseMins.forEach((mins, mIdx) => {
          const arrTime = new Date(now.getTime() + mins * 60000);
          results.push({
            id: `lrt-${routeNo}-${mIdx}`,
            dir: mIdx % 2 === 0 ? 'UP' : 'DOWN',
            route: routeNo,
            routeCode: routeNo,
            badgeLabel: 'LRT',
            lineColor: '#E97200',
            platform: ((rIdx % 3) + 1).toString(),
            destination: getLrtDestination(routeNo),
            minutes: mins,
            timeStr: arrTime.toTimeString().substring(0, 5),
            cars: (parseInt(routeNo) % 2 === 0) ? 2 : 1
          });
        });
      });
      return results.sort((a, b) => a.minutes - b.minutes);
    }

    function getLrtDestination(routeNo) {
      const destinations = {
        '505': { en: 'Siu Hong', 'zh-HK': '兆康', 'zh-CN': '兆康' },
        '507': { en: 'Tuen Mun Ferry Pier', 'zh-HK': '屯門碼頭', 'zh-CN': '屯门码头' },
        '610': { en: 'Yuen Long', 'zh-HK': '元朗', 'zh-CN': '元朗' },
        '614': { en: 'Yuen Long', 'zh-HK': '元朗', 'zh-CN': '元朗' },
        '614P': { en: 'Siu Hong', 'zh-HK': '兆康', 'zh-CN': '兆康' },
        '615': { en: 'Tuen Mun Ferry Pier', 'zh-HK': '屯門碼頭', 'zh-CN': '屯门码头' },
        '615P': { en: 'Tuen Mun Ferry Pier', 'zh-HK': '屯門碼頭', 'zh-CN': '屯门码头' },
        '705': { en: 'Tin Shui Wai Circular (Inner)', 'zh-HK': '天水圍循環綫 (內圈)', 'zh-CN': '天水围循环线 (内圈)' },
        '706': { en: 'Tin Shui Wai Circular (Outer)', 'zh-HK': '天水圍循環綫 (外圈)', 'zh-CN': '天水围循环线 (外圈)' },
        '751': { en: 'Tin Yi', 'zh-HK': '天逸', 'zh-CN': '天逸' },
        '751P': { en: 'Tin Shui Wai', 'zh-HK': '天水圍', 'zh-CN': '天水围' },
        '761P': { en: 'Yuen Long', 'zh-HK': '元朗', 'zh-CN': '元朗' }
      };
      return destinations[routeNo] || { en: 'Terminus', 'zh-HK': '總站', 'zh-CN': '总站' };
    }
  </script>
